<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Semana de Prova</title>
<meta name="theme-color" content="#2B59E0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#EEF3FA; --card:#FFFFFF; --ink:#1B2A4E; --ink2:#56637F; --line:#D3DDEC;
  --blue:#2B59E0; --on-blue:#FFFFFF; --blue-soft:#E3EAFD;
  --mark:#FFDF5E; --ok:#15885A; --ok-bg:#DFF5EA; --bad:#CF3640; --bad-bg:#FCE4E6;
  --shadow:0 2px 0 rgba(27,42,78,.10);
  --display:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#10182B; --card:#1A2440; --ink:#EAF0FF; --ink2:#A7B3D0; --line:#2D3A61;
    --blue:#86A6FF; --on-blue:#0D1630; --blue-soft:#24325C;
    --mark:#8A6F00; --ok:#5FD3A2; --ok-bg:#143627; --bad:#FF8A92; --bad-bg:#43191D;
    --shadow:0 2px 0 rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --paper:#10182B; --card:#1A2440; --ink:#EAF0FF; --ink2:#A7B3D0; --line:#2D3A61;
  --blue:#86A6FF; --on-blue:#0D1630; --blue-soft:#24325C;
  --mark:#8A6F00; --ok:#5FD3A2; --ok-bg:#143627; --bad:#FF8A92; --bad-bg:#43191D;
  --shadow:0 2px 0 rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0}
h1{font-size:1.75rem;font-weight:800}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.12rem;font-weight:700}
p{margin:.4em 0}
.mk{background:linear-gradient(transparent 52%,var(--mark) 52%,var(--mark) 92%,transparent 92%);padding:0 .15em;border-radius:2px}
#app{max-width:640px;margin:0 auto;padding:14px 16px 110px}
.muted{color:var(--ink2)}
.small{font-size:.88rem}

/* cabeçalho */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.kids{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.92rem}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}

/* régua da semana */
.ruler{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;margin:0 -2px 8px;scrollbar-width:none}
.ruler::-webkit-scrollbar{display:none}
.day{flex:0 0 58px;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:6px 2px 8px;text-align:center;position:relative}
.day .wd{font-size:.74rem;font-weight:700;color:var(--ink2)}
.day .dn{font-family:var(--display);font-weight:800;font-size:1.3rem;line-height:1.1}
.day .dots{display:flex;justify-content:center;gap:3px;min-height:9px;margin-top:3px}
.dot{width:8px;height:8px;border-radius:50%;border:2px solid var(--blue)}
.dot.f{background:var(--blue)}
.day.today{border-color:var(--ink)}
.day[aria-pressed="true"]{background:var(--mark);border-color:var(--ink)}
.day[aria-pressed="true"] .wd{color:var(--ink)}
.flag{position:absolute;top:-7px;right:-4px;background:var(--bad);color:#fff;font-size:.62rem;font-weight:800;border-radius:6px;padding:1px 5px}

/* cartões */
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin:10px 0;box-shadow:var(--shadow)}
.card.tap{display:block;width:100%;text-align:left}
.card.done{opacity:.72}
.card.alert{border-color:var(--bad);background:var(--bad-bg)}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.tag{display:inline-block;font-size:.76rem;font-weight:800;border-radius:8px;padding:2px 8px;background:var(--blue-soft);color:var(--ink)}
.tag.rev{background:var(--mark);color:var(--ink)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.check{flex:0 0 30px;height:30px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;font-weight:800;background:var(--card)}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);background:var(--card);border-radius:14px;padding:11px 16px;font-weight:800;min-height:48px;box-shadow:var(--shadow)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.ghost{border-color:var(--line);box-shadow:none;font-weight:700}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.link{background:none;border:0;padding:4px 0;color:var(--blue);font-weight:700;text-decoration:underline}

/* formulários */
label{display:block;font-weight:700;font-size:.92rem;margin:10px 0 4px}
input[type=text],input[type=password],input[type=date],select,textarea{width:100%;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;min-height:46px}
textarea{min-height:88px;resize:vertical}

/* passos */
.step{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;padding:9px 0;border-bottom:1.5px dashed var(--line)}
.step:last-child{border-bottom:0}
.step.on span:last-child{text-decoration:line-through;color:var(--ink2)}
.explain{white-space:pre-wrap;background:var(--blue-soft);border-radius:14px;padding:12px 14px;margin-top:10px}

/* quiz */
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;margin:8px 0;font-weight:600;min-height:52px}
.opt .l{flex:0 0 28px;height:28px;border-radius:8px;background:var(--blue-soft);display:grid;place-items:center;font-weight:800}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 14px}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .3s}
.score{font-family:var(--display);font-size:3.2rem;font-weight:800;line-height:1}

/* navegação */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:6px;z-index:5}
.nav button{flex:1;max-width:200px;border:0;background:none;border-radius:12px;padding:6px 4px;font-weight:800;font-size:.86rem;color:var(--ink2);min-height:52px}
.nav button .ic{display:block;font-size:1.3rem;line-height:1.2}
.nav button[aria-current="page"]{color:var(--ink);background:var(--mark)}
@media (prefers-color-scheme:dark){.nav button[aria-current="page"]{color:#fff}}

/* ocupado */
.veil{position:fixed;inset:0;background:rgba(16,24,43,.55);display:grid;place-items:center;z-index:20;padding:20px}
.veil .card{max-width:360px;text-align:center}
.pencil{font-size:2.4rem;display:inline-block;animation:wig 1s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg) translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.pencil{animation:none}.bar i{transition:none}}
.toast[hidden]{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 16px;font-weight:700;z-index:30;max-width:90%}
.links h3{margin:4px 0 6px}
.lk{display:flex;gap:10px;align-items:center;border:2px solid var(--blue);background:var(--blue-soft);color:var(--ink);border-radius:14px;padding:10px 12px;margin:8px 0;text-decoration:none;min-height:52px}
.lk .ic{font-size:1.5rem}
.lk .u{display:block;font-size:.76rem;color:var(--ink2);word-break:break-all;user-select:all;-webkit-user-select:all}
.note{border-left:5px solid var(--mark);padding:6px 12px;margin:10px 0;background:var(--card);border-radius:0 12px 12px 0}
ul.plain{margin:.3em 0;padding-left:1.2em}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" hidden></div>
<input type="file" id="file" accept="image/*,application/pdf,.pdf,.docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" multiple hidden>

<script>
"use strict";
/* ============ utilidades ============ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const pad = n => String(n).padStart(2, "0");
const dstr = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const parseD = s => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const validD = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s)) && !isNaN(parseD(s));
const today = () => dstr(new Date());
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return dstr(d); };
const WD = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
const WDL = ["domingo", "segunda-feira", "terça-feira", "quarta-feira", "quinta-feira", "sexta-feira", "sábado"];
const nice = s => { const d = parseD(s); return WDL[d.getDay()] + ", " + d.getDate() + "/" + pad(d.getMonth() + 1); };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const SERIES = ["1º ano", "2º ano", "3º ano", "4º ano", "5º ano", "6º ano", "7º ano", "8º ano", "9º ano"];
const MAX_CONTENT = 16000;
function cleanUrl(u) { u = String(u || "").trim().replace(/[)\].,;]+$/, ""); if (/^(www\.|youtu\.?be|[a-z0-9-]+\.(com|org|net|br)\b)/i.test(u)) u = "https://" + u; return /^https?:\/\/[^\s<>"']{4,}$/i.test(u) ? u.slice(0, 500) : ""; }
const isVideo = u => /youtube\.com|youtu\.be|vimeo\.com/i.test(u);
const ytId = u => { const m = /(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/|\/live\/)([\w-]{11})/.exec(String(u)); return m ? m[1] : ""; };
const linksOf = e => (e && Array.isArray(e.links) ? e.links : []);
const hasVideo = e => linksOf(e).some(l => isVideo(l.url));
const aiLinks = p => (Array.isArray(p && p.links) ? p.links : []).map(l => ({ url: cleanUrl(l && l.url), label: String((l && l.descricao) || "").slice(0, 80) })).filter(l => l.url).slice(0, 8);
function parseLinks(txt) { const out = []; String(txt || "").split(/\n+/).forEach(line => { const m = line.match(/(https?:\/\/\S+|www\.\S+|youtu\.be\/\S+)/i); if (!m) return; const url = cleanUrl(m[1]); if (url && !out.some(l => l.url === url)) out.push({ url, label: line.replace(m[1], "").replace(/^[\s:\-–]+|[\s:\-–]+$/g, "").slice(0, 80) }); }); return out.slice(0, 8); }
function linksHtml(e, title) { const L = linksOf(e); if (!L.length) return ""; return '<div class="links">' + (title ? "<h3>" + esc(title) + "</h3>" : "") + L.map(l => '<a class="lk" href="' + esc(l.url) + '" target="_blank" rel="noopener noreferrer"><span class="ic">' + (isVideo(l.url) ? "▶️" : "🔗") + '</span><span class="grow"><b>' + esc(l.label || (isVideo(l.url) ? "Vídeo que a professora indicou" : "Link que a professora indicou")) + '</b><span class="u">' + esc(l.url) + "</span></span></a>" + (e.id && ytId(l.url) && sample ? (l.read ? '<p class="small" style="margin:-2px 0 8px"><span class="tag ok">vídeo já entrou no material</span></p>' : '<button class="btn block" style="margin:-2px 0 10px" data-a="video" data-id="' + e.id + '" data-u="' + esc(l.url) + '">🎬 Ler este vídeo para o quiz</button>') : "")).join("") + "</div>"; }

/* ============ estado salvo no aparelho ============ */
const KEY = "semana-de-prova:v1";
let storageOk = true;
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) { const s = JSON.parse(raw); if (s && Array.isArray(s.kids)) return s; } }
  catch (e) { storageOk = false; }
  return { v: 1, kids: [], active: null, settings: { minutes: 45, weekends: true } };
}
let S = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { storageOk = false; } }
const kid = () => S.kids.find(k => k.id === S.active) || null;
const examOf = id => kid()?.exams.find(e => e.id === id) || null;
const sessOf = id => kid()?.sessions.find(s => s.id === id) || null;

/* ============ estado da tela ============ */
const ui = { files: [], tab: "hoje", day: today(), screen: null, arg: null, busy: null, toast: null, form: {}, quiz: null, explainLive: "" };
var sample = null, limits = null, aiChecked = false, ctl = null;
const quizJobs = {};

/* ============ IA: Gemini (chave guardada só neste aparelho, fora do backup) ============ */
const GKEY = "semana-de-prova:gemini";
const GAPI = "https://generativelanguage.googleapis.com/v1beta/";
const GDEFAULT = ["gemini-3.8-flash", "gemini-3.7-flash", "gemini-flash-latest", "gemini-2.5-flash"];
let G = (() => { try { return JSON.parse(localStorage.getItem(GKEY)) || {}; } catch (e) { return {}; } })();
const saveG = () => { try { localStorage.setItem(GKEY, JSON.stringify(G)); } catch (e) {} };
const b64 = blob => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = no; r.readAsDataURL(blob); });
function rankModels(list) {
  const ok = (list || []).filter(m => (m.supportedGenerationMethods || []).includes("generateContent")).map(m => String(m.name).replace(/^models\//, ""))
    .map(n => ({ n, m: /^gemini-(\d+(?:\.\d+)?)-flash(-lite)?$/.exec(n) })).filter(x => x.m);
  ok.sort((a, b) => (!!a.m[2] - !!b.m[2]) || (parseFloat(b.m[1]) - parseFloat(a.m[1])));
  return ok.map(x => x.n).slice(0, 5);
}
async function connectGemini(key) {
  let res; try { res = await fetch(GAPI + "models?pageSize=200", { headers: { "x-goog-api-key": key } }); } catch (e) { throw { code: "blocked" }; }
  let models = [];
  if (res.ok) models = rankModels((await res.json()).models);
  else if (res.status === 429) throw { code: "rate_limited" };
  else {
    // algumas chaves novas (AQ.) falham na listagem mas funcionam na geração: testa de verdade antes de recusar
    const err = await res.json().catch(() => ({})); const prev = G; G = { key, models: GDEFAULT, model: null };
    try { await gemini("Responda apenas: ok", {}, false); } catch (e) { G = prev; throw e.code === "bad_key" ? { code: "bad_key", message: "erro " + res.status + ": " + ((err.error && err.error.message) || "sem detalhe").slice(0, 140) } : e; }
    models = GDEFAULT;
  }
  G = { key, models: models.length ? models : GDEFAULT, model: null }; saveG(); sample = makeSample();
}
function parseLoose(t) {
  t = String(t || "").trim(); try { return JSON.parse(t); } catch (e) {}
  const f = /```(?:json)?\s*([\s\S]*?)```/.exec(t); if (f) { try { return JSON.parse(f[1]); } catch (e) {} }
  const a = t.search(/[{\[]/), z = Math.max(t.lastIndexOf("}"), t.lastIndexOf("]")); if (a >= 0 && z > a) { try { return JSON.parse(t.slice(a, z + 1)); } catch (e) {} }
  throw { code: "invalid_json", text: t };
}
async function gemini(prompt, o, wantJson) {
  const parts = []; if (o.video) parts.push({ file_data: { file_uri: o.video } });
  const imgs = o.images ? (Array.isArray(o.images) ? o.images : [o.images]) : [];
  for (const im of imgs) parts.push({ inline_data: { mime_type: im.type || "image/jpeg", data: await b64(im) } });
  parts.push({ text: prompt });
  const body = JSON.stringify({ contents: [{ role: "user", parts }], generationConfig: wantJson ? { responseMimeType: "application/json" } : {} });
  const cands = [...new Set([G.model].concat(G.models || [], GDEFAULT).filter(Boolean))].slice(0, 4); let last = { code: "upstream_error" }, throttled = false;
  for (const m of cands) {
    let res; try { res = await fetch(GAPI + "models/" + m + ":generateContent", { method: "POST", headers: { "Content-Type": "application/json", "x-goog-api-key": G.key }, body, signal: o.signal }); }
    catch (e) { throw { code: e && e.name === "AbortError" ? "cancelled" : "offline" }; }
    if (res.ok) {
      const d = await res.json(); const c = d.candidates && d.candidates[0];
      const text = ((c && c.content && c.content.parts) || []).filter(p => !p.thought).map(p => p.text || "").join("").trim();
      if (!text) throw { code: (d.promptFeedback && d.promptFeedback.blockReason) || (c && /SAFETY|PROHIBITED|BLOCK/.test(c.finishReason || "")) ? "refused" : "empty_completion" };
      if (G.model !== m && !throttled) { G.model = m; saveG(); }
      return text;
    }
    const err = await res.json().catch(() => ({})); const msg = (err.error && err.error.message) || "";
    if (res.status === 401 || res.status === 403 || /api key/i.test(msg)) throw { code: "bad_key", message: "erro " + res.status + ": " + msg.slice(0, 140) };
    if (res.status === 429) { last = { code: "rate_limited" }; throttled = true; continue; }
    if (res.status === 404 || res.status >= 500 || /model|not supported|not found/i.test(msg)) { last = { code: "upstream_error" }; continue; }
    throw { code: o.video ? "video_failed" : "upstream_error", message: msg };
  }
  throw last;
}
function makeSample() {
  const f = async (prompt, o = {}) => { const text = await gemini(prompt, o, false); if (o.onText) o.onText({ text, delta: text }); return { text, truncated: false }; };
  f.json = async (prompt, o = {}) => parseLoose(await gemini(prompt, o, true));
  f.limits = async () => ({ images: { maxCount: 6 } });
  return f;
}
sample = G.key ? makeSample() : null; limits = { images: { maxCount: 6 } }; aiChecked = true;
const canImages = () => !!sample;
const imgMax = () => (limits && limits.images && limits.images.maxCount) || 3;
const ERR = {
  bad_key: "A chave do Gemini não foi aceita. Confira em Pais se ela foi colada inteira.",
  offline: "Sem conexão com o Gemini. Confira a internet e tente de novo.",
  blocked: "O navegador bloqueou a conexão com o Gemini. Isso acontece se o app for aberto dentro do Claude ou de um visualizador de arquivos: abra pelo link do GitHub Pages (ou baixe o arquivo e abra no Chrome).",
  rate_limited: "O limite gratuito por minuto foi atingido. Espere um minutinho e tente de novo.",
  images_unavailable: "Não consegui enviar as fotos. Use “Colar texto” no lugar.",
  image_rejected: "Não consegui usar uma das fotos. Tire outra (JPG ou PNG) e tente de novo.",
  prompt_too_large: "Material grande demais para ler de uma vez. Envie menos páginas por vez.",
  refused: "A IA não pôde responder a esse material. Tente com outras fotos.",
  video_failed: "Não consegui assistir a esse vídeo. Ele precisa ser público no YouTube (privado ou não listado não funciona).",
};
const errMsg = e => ((e && ERR[e.code]) || "Não deu certo desta vez. Tente de novo.") + (e && e.code === "bad_key" && e.message ? " (" + e.message + ")" : "");
function confirmBox(msg, yes, label) { ui.confirm = { msg, yes, label }; }
function busy(msg, sub) { ui.busy = { msg, sub: sub || "" }; render(); }
function idle() { ui.busy = null; ctl = null; render(); }
function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, Math.max(4200, String(t).length * 70)); }
async function askText(prompt, opts = {}) { ctl = new AbortController(); const r = await sample(prompt, { signal: ctl.signal, ...opts }); return r.text; }
async function askJSON(prompt, opts = {}) { ctl = new AbortController(); return await sample.json(prompt, { signal: ctl.signal, ...opts }); }

/* ============ arquivos: fotos e PDF ============ */
async function shrink(file) {
  try {
    const bmp = await createImageBitmap(file);
    const sc = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));

function fetchQuiz(sid, fresh) {
  if (!fresh && quizJobs[sid]) return quizJobs[sid];
  const s = sessOf(sid), ex = s && examOf(s.examId);
  const job = (async () => {
    const r = await sample.json(quizPrompt(s, ex), { cache: false });
    const qs = [];
    for (const q of (r && r.perguntas) || []) {
      if (!q || !q.pergunta || !Array.isArray(q.opcoes) || q.opcoes.length < 2) continue;
      const ci = Number(q.correta); if (!(ci >= 0 && ci < q.opcoes.length)) continue;
      const opts = shuffle(q.opcoes.map((t, i) => ({ t: String(t), ok: i === ci })));
      qs.push({ q: String(q.pergunta), opts, why: String(q.explicacao || ""), topic: String(q.assunto || "") });
    }
    if (!qs.length) throw { code: "invalid_json" };
    return qs;
  })();
  job.catch(() => { if (quizJobs[sid] === job) delete quizJobs[sid]; });
  quizJobs[sid] = job; return job;
}
async function startQuiz(sid) {
  if (!sample) return toast("Para o quiz, ligue a IA na aba Pais.");
  busy("Preparando suas perguntas…", "Só um pouquinho!");
  try { const qs = await fetchQuiz(sid); delete quizJobs[sid]; ui.quiz = { sid, qs, i: 0, picked: null, right: 0, wrong: [] }; ui.screen = "quiz"; idle(); }
  catch (e) { delete quizJobs[sid]; idle(); toast(errMsg(e)); }
}
function finishQuiz() {
  const z = ui.quiz, s = sessOf(z.sid), ex = s && examOf(s.examId);
  if (s && ex) {
    s.score = { right: z.right, total: z.qs.length, at: today() }; s.done = true; s.steps.forEach(x => x.done = true);
    ex.asked = ex.asked.concat(z.qs.map(q => q.q.slice(0, 90))).slice(-40);
    ex.misses = ex.misses.concat(z.wrong).slice(-20); save();
  }
  ui.screen = "result"; render();
}

  h += '<div class="card"><h2>Crianças</h2>' + S.kids.map(x => '<div class="row between" style="padding:6px 0"><span><b>' + esc(x.name) + "</b> · " + esc(x.grade) + '</span><button class="link" data-a="delkid" data-id="' + x.id + '">remover</button></div>').join("") + '<div class="btns"><button class="btn" data-a="newkid">＋ Adicionar criança</button><button class="btn ghost" data-a="newweek">Nova semana de provas</button></div></div>';
  h += '<div class="card"><h2>Cópia de segurança</h2><p class="small muted">' + (storageOk ? "Os dados ficam só neste aparelho e neste navegador." : "<b>Atenção:</b> este navegador não está deixando salvar; ao fechar, os dados se perdem.") + ' Para levar a outro aparelho, copie o código e cole lá.</p><div class="btns"><button class="btn ghost" data-a="export">Mostrar código</button><button class="btn ghost" data-a="import">Colar código</button></div>' +
    (ui.form.io ? '<textarea id="io" style="margin-top:10px;font-size:.78rem" ' + (ui.form.io === "export" ? "readonly>" + esc(JSON.stringify(S)) : 'placeholder="Cole o código aqui">') + "</textarea>" + (ui.form.io === "import" ? '<div class="btns"><button class="btn pri" data-a="doimport">Restaurar</button></div>' : "") : "") + "</div>";
  h += '<p class="small muted">As explicações e perguntas são feitas por IA a partir do material enviado e podem conter erros. Na dúvida, vale o que está no livro e o que a professora ensinou.</p>';
  return h;
}
function render() {
  const k = kid(); let h;
  if (!k || ui.screen === "welcome") h = vWelcome();
  else if (ui.screen === "notice") h = vNotice();
  else if (ui.screen === "exam") h = vExamForm();
  else if (ui.screen === "paste") h = vPaste();
  else if (ui.screen === "session") h = vSession();
  else if (ui.screen === "quiz") h = vQuiz();
  else if (ui.screen === "result") h = vResult();
  else h = ui.tab === "provas" ? vProvas() : ui.tab === "pais" ? vPais() : vHoje();
  if (k && !ui.screen) h += '<nav class="nav" aria-label="Seções">' + [["hoje", "📅", "Hoje"], ["provas", "📝", "Provas"], ["pais", "👀", "Pais"]].map(([t, ic, l]) => '<button data-a="tab" data-t="' + t + '"' + (ui.tab === t ? ' aria-current="page"' : "") + '><span class="ic">' + ic + "</span>" + l + "</button>").join("") + "</nav>";
  if (ui.busy) h += '<div class="veil" role="alertdialog" aria-label="Aguarde"><div class="card"><div class="pencil">✏️</div><h2>' + esc(ui.busy.msg) + '</h2><p class="muted small">' + esc(ui.busy.sub) + '</p><div class="btns" style="justify-content:center"><button class="btn ghost" data-a="stop">Parar</button></div></div></div>';
  if (ui.confirm) h += '<div class="veil" role="alertdialog" aria-label="Confirmar"><div class="card"><h2>' + esc(ui.confirm.msg) + '</h2><div class="btns" style="justify-content:center"><button class="btn ghost" data-a="cno">Cancelar</button><button class="btn pri" data-a="cyes">' + esc(ui.confirm.label || "Sim") + "</button></div></div></div>";
  $("#app").innerHTML = h;
}
function keepForm() { document.querySelectorAll("#app input[id],#app textarea[id],#app select[id]").forEach(el => { const m = { kname: "name", kgrade: "grade", ntext: "ntext", esub: "subject", edate: "date", etop: "topics", epag: "pages", elinks: "links", ptext: "ptext" }[el.id]; if (m) ui.form[m] = el.value; }); }

/* ============ ações ============ */
const A = {
  tab(d) { ui.tab = d.t; ui.screen = null; ui.form = {}; if (d.t === "hoje") ui.day = today(); },
  day(d) { ui.day = d.d; },
  kid(d) { S.active = d.id; save(); ui.screen = null; ui.day = today(); },
  newkid() { ui.form = {}; ui.screen = "welcome"; },
  back() { ui.screen = null; ui.form = {}; if (ctl) ctl.abort(); ui.explainLive = ""; },
  savekid() { const name = (ui.form.name || "").trim(); if (!name) return toast("Escreva o nome ou apelido."); const k = { id: uid(), name: name.slice(0, 20), grade: ui.form.grade || "5º ano", exams: [], sessions: [], planAt: null }; S.kids.push(k); S.active = k.id; save(); ui.screen = null; ui.form = {}; ui.tab = "provas"; },
  delkid(d) { const x = S.kids.find(k => k.id === d.id); if (!x) return; confirmBox("Remover " + x.name + " e tudo o que foi salvo?", () => { S.kids = S.kids.filter(k => k.id !== d.id); if (S.active === d.id) S.active = S.kids[0]?.id || null; save(); }, "Remover"); },
  newweek() { const k = kid(); confirmBox("Apagar as provas e o roteiro de " + k.name + " para começar uma nova semana?", () => { k.exams = []; k.sessions = []; k.planAt = null; save(); ui.tab = "provas"; }, "Apagar"); },
  notice() { ui.form = {}; ui.files = []; ui.screen = "notice"; },
  async noticefile() { const files = await pickFiles(); keepForm(); for (const f of files) if (ui.files.length < 12) ui.files.push(f); render(); },
  rmfile(d) { ui.files.splice(+d.i, 1); },
  noticego() { const t = (ui.form.ntext || "").trim(); if (!ui.files.length && t.length < 10) return toast("Escolha os arquivos ou cole o texto do aviso."); readNotice(ui.files.slice(), t); },
  addexam() { ui.form = {}; ui.screen = "exam"; },
  editexam(d) { const e = examOf(d.id); if (!e) return; ui.form = { id: e.id, subject: e.subject, date: e.date, topics: e.topics, pages: e.pages, nPages: e.nPages, links: linksOf(e).map(l => l.url + (l.label ? " " + l.label : "")).join("\n") }; ui.screen = "exam"; },
  saveexam() { const f = ui.form, k = kid(); if (!(f.subject || "").trim()) return toast("Escreva a matéria."); if (!validD(f.date)) return toast("Escolha o dia da prova."); let e = f.id && examOf(f.id); if (!e) { e = { id: uid(), content: "", nPages: 0, misses: [], asked: [] }; k.exams.push(e); } const moved = e.date && e.date !== f.date; Object.assign(e, { subject: f.subject.trim().slice(0, 60), date: f.date, topics: (f.topics || "").trim(), pages: (f.pages || "").trim(), links: parseLinks(f.links) }); k.exams.sort((a, b) => (a.date || "9").localeCompare(b.date || "9")); save(); ui.screen = null; ui.form = {}; if (moved && k.sessions.length) toast("Data mudou: monte o roteiro de novo."); },
  delexam() { const k = kid(), id = ui.form.id; confirmBox("Apagar esta prova e as sessões dela?", () => { k.exams = k.exams.filter(e => e.id !== id); k.sessions = k.sessions.filter(s => s.examId !== id); save(); ui.screen = null; ui.form = {}; }, "Apagar"); },
  clearpages() { const e = examOf(ui.form.id); if (!e) return; confirmBox("Apagar o conteúdo lido das páginas desta prova?", () => { e.content = ""; e.nPages = 0; ui.form.nPages = 0; save(); }, "Apagar"); },
  pages(d) { readPages(d.id); },
  video(d) { readVideo(d.id, d.u); },
  async gsave() { const key = ($("#gkey") ? $("#gkey").value : "").trim(); if (key.length < 20) return toast("Cole a chave inteira do Gemini."); busy("Testando a chave…"); try { await connectGemini(key); idle(); toast("IA ligada! Modelo: " + (G.models[0] || "Gemini")); } catch (e) { idle(); toast(errMsg(e)); } },
  goff() { confirmBox("Desligar a IA e apagar a chave deste aparelho?", () => { G = {}; saveG(); sample = null; }, "Desligar"); },
  planone(d) { const e = examOf(d.id); if (!e) return; if (!e.content && sample) return confirmBox("Ainda não há material de " + e.subject + ". Montar o roteiro só com os assuntos do comunicado?", () => makePlan(e.id), "Montar"); return makePlan(e.id); },
  paste(d) { ui.form = {}; ui.arg = d.id; ui.screen = "paste"; window.scrollTo(0, 0); },
  savepaste() { const e = examOf(ui.arg), t = (ui.form.ptext || "").trim(); if (!e) return; if (t.length < 20) return toast("Cole o texto do material primeiro."); e.content = ((e.content ? e.content + "\n\n" : "") + t).slice(0, MAX_CONTENT); e.nPages = (e.nPages || 0) + 1; save(); ui.screen = null; ui.form = {}; toast("Material guardado! Já vale para as explicações e os quizzes."); },
  plan() { const k = kid(); const missing = k.exams.filter(e => !e.nPages && e.date > today()).length; if (missing && sample) return confirmBox(missing + " prova(s) ainda sem páginas enviadas. Montar o roteiro mesmo assim?", makePlan, "Montar"); return makePlan(); },
  open(d) { ui.screen = "session"; ui.arg = d.id; ui.explainLive = ""; window.scrollTo(0, 0); },
  step(d) { const s = sessOf(ui.arg); if (!s) return; const x = s.steps[+d.i]; x.done = !x.done; save(); if (sample && s.steps.every(y => y.done) && !s.score) fetchQuiz(s.id).catch(() => {}); },
  toggledone() { const s = sessOf(ui.arg); s.done = !s.done; save(); if (s.done) { ui.screen = null; } },
  explain() { explain(ui.arg); },
  quiz() { startQuiz(ui.arg); },
  pick(d) { const z = ui.quiz; if (z.picked !== null) return; z.picked = +d.i; const q = z.qs[z.i]; if (q.opts[z.picked].ok) z.right++; else z.wrong.push({ q: q.q.slice(0, 90), topic: q.topic }); },
  nextq() { const z = ui.quiz; if (z.i + 1 < z.qs.length) { z.i++; z.picked = null; window.scrollTo(0, 0); } else return finishQuiz(); },
  quitquiz() { confirmBox("Sair do quiz? As respostas não ficam salvas.", () => { ui.screen = "session"; ui.quiz = null; }, "Sair"); },
  endquiz() { ui.screen = null; ui.quiz = null; ui.tab = "hoje"; },
  retryquiz() { const sid = ui.quiz.sid; ui.arg = sid; ui.screen = "session"; ui.quiz = null; startQuiz(sid); },
  stop() { if (ctl) ctl.abort(); idle(); },
  cno() { ui.confirm = null; },
  cyes() { const f = ui.confirm && ui.confirm.yes; ui.confirm = null; if (f) return f(); },
  export() { ui.form.io = ui.form.io === "export" ? null : "export"; },
  import() { ui.form.io = ui.form.io === "import" ? null : "import"; },
  doimport() { try { const s = JSON.parse($("#io").value); if (!s || !Array.isArray(s.kids)) throw 0; confirmBox("Substituir os dados deste aparelho pelos do código?", () => { S = s; S.settings = S.settings || { minutes: 45, weekends: true }; save(); ui.form = {}; toast("Dados restaurados."); }, "Substituir"); } catch (e) { toast("Esse código não é válido."); } },
};
document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-a]"); if (!b || b.disabled) return;
  keepForm(); const fn = A[b.dataset.a]; if (!fn) return;
  fn(b.dataset); render();
});
document.addEventListener("change", ev => {
  const c = ev.target.dataset && ev.target.dataset.c; if (!c) return;
  if (c === "minutes") S.settings.minutes = +ev.target.value; if (c === "weekends") S.settings.weekends = ev.target.checked; save();
});
document.addEventListener("focusin", ev => { if (ev.target.id === "io" && ev.target.readOnly) ev.target.select(); });
render();
</script>
