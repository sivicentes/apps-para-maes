<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Semana de Prova</title>
<meta name="theme-color" content="#2B59E0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#EEF3FA; --card:#FFFFFF; --ink:#1B2A4E; --ink2:#56637F; --line:#D3DDEC;
  --blue:#2B59E0; --on-blue:#FFFFFF; --blue-soft:#E3EAFD;
  --mark:#FFDF5E; --ok:#15885A; --ok-bg:#DFF5EA; --bad:#CF3640; --bad-bg:#FCE4E6;
  --shadow:0 2px 0 rgba(27,42,78,.10);
  --display:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#10182B; --card:#1A2440; --ink:#EAF0FF; --ink2:#A7B3D0; --line:#2D3A61;
    --blue:#86A6FF; --on-blue:#0D1630; --blue-soft:#24325C;
    --mark:#8A6F00; --ok:#5FD3A2; --ok-bg:#143627; --bad:#FF8A92; --bad-bg:#43191D;
    --shadow:0 2px 0 rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --paper:#10182B; --card:#1A2440; --ink:#EAF0FF; --ink2:#A7B3D0; --line:#2D3A61;
  --blue:#86A6FF; --on-blue:#0D1630; --blue-soft:#24325C;
  --mark:#8A6F00; --ok:#5FD3A2; --ok-bg:#143627; --bad:#FF8A92; --bad-bg:#43191D;
  --shadow:0 2px 0 rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0}
h1{font-size:1.75rem;font-weight:800}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.12rem;font-weight:700}
p{margin:.4em 0}
.mk{background:linear-gradient(transparent 52%,var(--mark) 52%,var(--mark) 92%,transparent 92%);padding:0 .15em;border-radius:2px}
#app{max-width:640px;margin:0 auto;padding:14px 16px 110px}
.muted{color:var(--ink2)}
.small{font-size:.88rem}

/* cabeçalho */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.kids{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.92rem}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}

/* régua da semana */
.ruler{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;margin:0 -2px 8px;scrollbar-width:none}
.ruler::-webkit-scrollbar{display:none}
.day{flex:0 0 58px;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:6px 2px 8px;text-align:center;position:relative}
.day .wd{font-size:.74rem;font-weight:700;color:var(--ink2)}
.day .dn{font-family:var(--display);font-weight:800;font-size:1.3rem;line-height:1.1}
.day .dots{display:flex;justify-content:center;gap:3px;min-height:9px;margin-top:3px}
.dot{width:8px;height:8px;border-radius:50%;border:2px solid var(--blue)}
.dot.f{background:var(--blue)}
.day.today{border-color:var(--ink)}
.day[aria-pressed="true"]{background:var(--mark);border-color:var(--ink)}
.day[aria-pressed="true"] .wd{color:var(--ink)}
.flag{position:absolute;top:-7px;right:-4px;background:var(--bad);color:#fff;font-size:.62rem;font-weight:800;border-radius:6px;padding:1px 5px}

/* cartões */
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin:10px 0;box-shadow:var(--shadow)}
.card.tap{display:block;width:100%;text-align:left}
.card.done{opacity:.72}
.card.alert{border-color:var(--bad);background:var(--bad-bg)}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.tag{display:inline-block;font-size:.76rem;font-weight:800;border-radius:8px;padding:2px 8px;background:var(--blue-soft);color:var(--ink)}
.tag.rev{background:var(--mark);color:var(--ink)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.check{flex:0 0 30px;height:30px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;font-weight:800;background:var(--card)}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);background:var(--card);border-radius:14px;padding:11px 16px;font-weight:800;min-height:48px;box-shadow:var(--shadow)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.ghost{border-color:var(--line);box-shadow:none;font-weight:700}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.link{background:none;border:0;padding:4px 0;color:var(--blue);font-weight:700;text-decoration:underline}

/* formulários */
label{display:block;font-weight:700;font-size:.92rem;margin:10px 0 4px}
input[type=text],input[type=password],input[type=date],select,textarea{width:100%;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;min-height:46px}
textarea{min-height:88px;resize:vertical}

/* passos */
.step{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;padding:9px 0;border-bottom:1.5px dashed var(--line)}
.step:last-child{border-bottom:0}
.step.on span:last-child{text-decoration:line-through;color:var(--ink2)}
.explain{white-space:pre-wrap;background:var(--blue-soft);border-radius:14px;padding:12px 14px;margin-top:10px}

/* quiz */
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;margin:8px 0;font-weight:600;min-height:52px}
.opt .l{flex:0 0 28px;height:28px;border-radius:8px;background:var(--blue-soft);display:grid;place-items:center;font-weight:800}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 14px}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .3s}
.score{font-family:var(--display);font-size:3.2rem;font-weight:800;line-height:1}

/* navegacao em fichas: uma linha por assunto, com o estado ja visivel */
.hub{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:13px 14px;margin:9px 0;box-shadow:var(--shadow);transition:transform .12s ease,border-color .12s ease}
.hub:hover{border-color:var(--ink)}
.hub:active{transform:translateY(1px);box-shadow:none}
.hub .ico{flex:0 0 44px;height:44px;border-radius:13px;background:var(--blue-soft);display:grid;place-items:center;font-size:1.3rem}
.hub .tt{font-family:var(--display);font-weight:700;font-size:1.06rem;display:block;line-height:1.2}
.hub .sub{font-size:.83rem;color:var(--ink2);display:block;margin-top:1px}
.hub .chev{flex:0 0 auto;color:var(--line);font-size:1.5rem;font-weight:800;line-height:1}
.hub:hover .chev{color:var(--ink2)}
.hub.warn{border-color:var(--bad)}
.hub.warn .ico{background:var(--bad-bg)}

/* rotulo de secao: discreto, so para dar respiro */
.sec{font-family:var(--body);font-weight:800;font-size:.76rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);margin:26px 0 2px;padding-left:2px}

/* cartao de prova enxuto: informacao densa, um toque so */
.exam{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:13px 15px;margin:9px 0;box-shadow:var(--shadow);transition:transform .12s ease,border-color .12s ease}
.exam:hover{border-color:var(--ink)}
.exam:active{transform:translateY(1px);box-shadow:none}
.exam.past{opacity:.6}
.exam h3{font-size:1.14rem}
.exam .when{font-size:.8rem;font-weight:800;color:var(--ink2);white-space:nowrap}
.exam .when.soon{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.chips .tag{font-size:.72rem}

/* cabecalho de sub-tela */
.subhead{margin:2px 0 6px}
.subhead h1{font-size:1.5rem}
.subhead .crumb{font-size:.82rem;color:var(--ink2);font-weight:700}

/* grupo de acoes dentro de um cartao */
.acts{display:grid;gap:8px;margin-top:11px}
@media (min-width:480px){.acts.two{grid-template-columns:1fr 1fr}}
.acts .btn{width:100%}
.btn.ghost.danger{border-color:var(--bad);color:var(--bad);box-shadow:none}

/* navegação */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:6px;z-index:5}
.nav button{flex:1;max-width:200px;border:0;background:none;border-radius:12px;padding:6px 4px;font-weight:800;font-size:.86rem;color:var(--ink2);min-height:52px}
.nav button .ic{display:block;font-size:1.3rem;line-height:1.2}
.nav button[aria-current="page"]{color:var(--ink);background:var(--mark)}
@media (prefers-color-scheme:dark){.nav button[aria-current="page"]{color:#fff}}

/* ocupado */
.veil{position:fixed;inset:0;background:rgba(16,24,43,.55);display:grid;place-items:center;z-index:20;padding:20px}
.veil .card{max-width:360px;text-align:center}
.pencil{font-size:2.4rem;display:inline-block;animation:wig 1s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg) translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.pencil{animation:none}.bar i{transition:none}}
.toast[hidden]{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 16px;font-weight:700;z-index:30;max-width:90%}
/* camera em lote: fica fora do #app, entao o render() nao a destroi */
.cam{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column}
/* o display:flex acima vence o display:none que o atributo hidden aplica pelo
   navegador, entao a tela precisa ser escondida explicitamente. Sem esta linha
   a camera cobre o app inteiro desde que ele abre. */
.cam[hidden]{display:none}
.cam video{flex:1;width:100%;min-height:0;object-fit:contain;background:#000}
.cam .topo{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;color:#fff;font-family:var(--display);font-weight:700}
.cam .topo .qtd{background:var(--mark);color:var(--ink);border-radius:999px;padding:3px 12px;font-size:.9rem}
.cam .topo button{background:none;border:none;color:#fff;font:inherit;font-size:1rem;padding:8px;cursor:pointer}
.cam .tiras{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;background:#000;min-height:0}
.cam .tiras figure{position:relative;margin:0;flex:0 0 auto}
.cam .tiras img{height:54px;width:auto;border-radius:8px;display:block;border:2px solid #fff3}
.cam .tiras b{position:absolute;left:3px;bottom:3px;background:#000b;color:#fff;border-radius:6px;font-size:.7rem;padding:0 5px}
.cam .tiras button{position:absolute;top:-4px;right:-4px;width:22px;height:22px;border-radius:999px;border:none;background:var(--bad);color:#fff;font-size:.8rem;line-height:1;cursor:pointer;padding:0}
.cam .baixo{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 22px calc(18px + env(safe-area-inset-bottom,0px));background:#000}
.cam .disp{width:72px;height:72px;border-radius:999px;background:#fff;border:5px solid #fff6;cursor:pointer;flex:0 0 auto;padding:0}
.cam .disp:active{transform:scale(.94)}
.cam .disp[disabled]{opacity:.4}
.cam .lado{min-width:92px;color:#fff;font-size:.9rem;font-weight:700;background:none;border:none;cursor:pointer;padding:10px}
.cam .lado.ok{background:var(--mark);color:var(--ink);border-radius:999px;padding:12px 18px}
.cam .aviso{color:#fff;text-align:center;padding:20px;font-size:.95rem;line-height:1.5}
.cam .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:2}
.cam .flash.on{animation:pisca .22s ease-out}
@keyframes pisca{from{opacity:.85}to{opacity:0}}
.links h3{margin:4px 0 6px}
.lk{display:flex;gap:10px;align-items:center;border:2px solid var(--blue);background:var(--blue-soft);color:var(--ink);border-radius:14px;padding:10px 12px;margin:8px 0;text-decoration:none;min-height:52px}
.lk .ic{font-size:1.5rem}
.lk .u{display:block;font-size:.76rem;color:var(--ink2);word-break:break-all;user-select:all;-webkit-user-select:all}
.note{border-left:5px solid var(--mark);padding:6px 12px;margin:10px 0;background:var(--card);border-radius:0 12px 12px 0}
ul.plain{margin:.3em 0;padding-left:1.2em}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" hidden></div>
<input type="file" id="file" accept="image/*,application/pdf,.pdf,.docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" multiple hidden>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<div id="camera" class="cam" hidden>
  <div class="topo"><button type="button" id="camsai">✕ Cancelar</button><span id="camqtd" class="qtd">0 fotos</span></div>
  <video id="camvid" playsinline autoplay muted></video>
  <div class="flash" id="camflash"></div>
  <div class="tiras" id="camtiras"></div>
  <div class="baixo">
    <span class="lado" id="camdica">uma página por foto</span>
    <button type="button" class="disp" id="camtira" aria-label="Tirar foto"></button>
    <button type="button" class="lado ok" id="camok">Pronto</button>
  </div>
</div>

<script>
"use strict";
/* ============ utilidades ============ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const pad = n => String(n).padStart(2, "0");
const dstr = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const parseD = s => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const validD = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s)) && !isNaN(parseD(s));
const today = () => dstr(new Date());
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return dstr(d); };
const WD = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
const WDL = ["domingo", "segunda-feira", "terça-feira", "quarta-feira", "quinta-feira", "sexta-feira", "sábado"];
const nice = s => { const d = parseD(s); return WDL[d.getDay()] + ", " + d.getDate() + "/" + pad(d.getMonth() + 1); };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const SERIES = ["1º ano", "2º ano", "3º ano", "4º ano", "5º ano", "6º ano", "7º ano", "8º ano", "9º ano"];
const MAX_CONTENT = 16000;
function cleanUrl(u) { u = String(u || "").trim().replace(/[)\].,;]+$/, ""); if (/^(www\.|youtu\.?be|[a-z0-9-]+\.(com|org|net|br)\b)/i.test(u)) u = "https://" + u; return /^https?:\/\/[^\s<>"']{4,}$/i.test(u) ? u.slice(0, 500) : ""; }
const isVideo = u => /youtube\.com|youtu\.be|vimeo\.com/i.test(u);
const ytId = u => { const m = /(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/|\/live\/)([\w-]{11})/.exec(String(u)); return m ? m[1] : ""; };
const linksOf = e => (e && Array.isArray(e.links) ? e.links : []);
const hasVideo = e => linksOf(e).some(l => isVideo(l.url));
const aiLinks = p => (Array.isArray(p && p.links) ? p.links : []).map(l => ({ url: cleanUrl(l && l.url), label: String((l && l.descricao) || "").slice(0, 80) })).filter(l => l.url).slice(0, 8);
function parseLinks(txt) { const out = []; String(txt || "").split(/\n+/).forEach(line => { const m = line.match(/(https?:\/\/\S+|www\.\S+|youtu\.be\/\S+)/i); if (!m) return; const url = cleanUrl(m[1]); if (url && !out.some(l => l.url === url)) out.push({ url, label: line.replace(m[1], "").replace(/^[\s:\-–]+|[\s:\-–]+$/g, "").slice(0, 80) }); }); return out.slice(0, 8); }
function linksHtml(e, title) { const L = linksOf(e); if (!L.length) return ""; return '<div class="links">' + (title ? "<h3>" + esc(title) + "</h3>" : "") + L.map(l => '<a class="lk" href="' + esc(l.url) + '" target="_blank" rel="noopener noreferrer"><span class="ic">' + (isVideo(l.url) ? "▶️" : "🔗") + '</span><span class="grow"><b>' + esc(l.label || (isVideo(l.url) ? "Vídeo que a professora indicou" : "Link que a professora indicou")) + '</b><span class="u">' + esc(l.url) + "</span></span></a>" + (e.id && ytId(l.url) && sample ? (l.read ? '<p class="small" style="margin:-2px 0 8px"><span class="tag ok">vídeo já entrou no material</span></p>' : '<button class="btn block" style="margin:-2px 0 10px" data-a="video" data-id="' + e.id + '" data-u="' + esc(l.url) + '">🎬 Ler este vídeo para o quiz</button>') : "")).join("") + "</div>"; }

/* ============ estado salvo no aparelho ============ */
const KEY = "semana-de-prova:v1";
let storageOk = true;
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) { const s = JSON.parse(raw); if (s && Array.isArray(s.kids)) return s; } }
  catch (e) { storageOk = false; }
  return { v: 1, kids: [], active: null, settings: { minutes: 45, weekends: true } };
}
let S = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { storageOk = false; } }
const kid = () => S.kids.find(k => k.id === S.active) || null;
const examOf = id => kid()?.exams.find(e => e.id === id) || null;
const sessOf = id => kid()?.sessions.find(s => s.id === id) || null;

/* ============ estado da tela ============ */
const ui = { files: [], tab: "hoje", day: today(), screen: null, arg: null, busy: null, toast: null, form: {}, quiz: null, explainLive: "" };
var sample = null, limits = null, aiChecked = false, ctl = null;
const quizJobs = {};

/* ============ IA: Gemini (chave guardada só neste aparelho, fora do backup) ============ */
const GKEY = "semana-de-prova:gemini";
const GAPI = "https://generativelanguage.googleapis.com/v1beta/";
const GDEFAULT = ["gemini-3.8-flash", "gemini-3.7-flash", "gemini-flash-latest", "gemini-2.5-flash"];
let G = (() => { try { return JSON.parse(localStorage.getItem(GKEY)) || {}; } catch (e) { return {}; } })();
const saveG = () => { try { localStorage.setItem(GKEY, JSON.stringify(G)); } catch (e) {} };
const b64 = blob => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = no; r.readAsDataURL(blob); });
function rankModels(list) {
  const ok = (list || []).filter(m => (m.supportedGenerationMethods || []).includes("generateContent")).map(m => String(m.name).replace(/^models\//, ""))
    .map(n => ({ n, m: /^gemini-(\d+(?:\.\d+)?)-flash(-lite)?$/.exec(n) })).filter(x => x.m);
  ok.sort((a, b) => (!!a.m[2] - !!b.m[2]) || (parseFloat(b.m[1]) - parseFloat(a.m[1])));
  return ok.map(x => x.n).slice(0, 5);
}
async function connectGemini(key) {
  let res; try { res = await fetch(GAPI + "models?pageSize=200", { headers: { "x-goog-api-key": key } }); } catch (e) { throw { code: "blocked" }; }
  let models = [];
  if (res.ok) models = rankModels((await res.json()).models);

function camQuadro(video) {
  const w = video.videoWidth || 0, h = video.videoHeight || 0;
  if (!w || !h) return null;
  const sc = Math.min(1, 1600 / Math.max(w, h));
  const c = document.createElement("canvas");
  c.width = Math.round(w * sc); c.height = Math.round(h * sc);
  c.getContext("2d").drawImage(video, 0, 0, c.width, c.height);
  return c;
}
function camArquivo(blob, n) {
  const nome = "pagina-" + pad(n) + ".jpg";
  try { return new File([blob], nome, { type: "image/jpeg" }); } catch (e) { blob.name = nome; return blob; }
}

/* Espera a camera comecar a mandar imagem de verdade. Permissao dada nao
   garante quadro: camera ocupada por outro programa, driver travado ou aba em
   segundo plano deixam o video preto para sempre. */
function camTemImagem(video, ms = 6000) {
  return new Promise(res => {
    const t0 = Date.now();
    (function olha() {
      if (video.videoWidth > 0 && video.videoHeight > 0) return res(true);
      if (Date.now() - t0 > ms) return res(false);
      setTimeout(olha, 120);
    })();
  });
}

async function abrirCamera(limite) {
  if (!temCameraViva()) { const fs = await pickFiles(true); return fs.slice(0, Math.max(0, limite - ui.files.length)); }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1440 } }, audio: false });
  } catch (e) {
    toast("Não consegui abrir a câmera aqui. Vou usar a do aparelho, uma foto por vez.");
    const fs = await pickFiles(true); return fs.slice(0, Math.max(0, limite - ui.files.length));
  }
  camStream = stream;
  const tela = $("#camera"), video = $("#camvid"), tiras = $("#camtiras"), qtd = $("#camqtd"),
    disp = $("#camtira"), flash = $("#camflash"), jaTinha = ui.files.length;
  tela.hidden = false;               // precisa estar na tela antes de tocar
  video.srcObject = stream;
  try { await video.play(); } catch (e) {}
  /* imagem que nao vem deixaria a pessoa presa numa tela preta: melhor cair
     na camera do aparelho, que sempre funciona */
  if (!(await camTemImagem(video))) {
    camFecha();
    toast("A câmera abriu, mas a imagem não veio. Vou usar a do aparelho.");
    const fs = await pickFiles(true); return fs.slice(0, Math.max(0, limite - ui.files.length));
  }

  const novas = [];
  const pinta = () => {
    const n = novas.length;
    qtd.textContent = n === 1 ? "1 foto" : n + " fotos";
    disp.disabled = jaTinha + n >= limite;
    $("#camdica").textContent = disp.disabled ? "fila cheia (" + limite + ")" : n ? "toque para a próxima" : "uma página por foto";
    tiras.innerHTML = novas.map((f, i) =>
      '<figure><img alt="" src="' + f.url + '"><b>' + (jaTinha + i + 1) + '</b><button type="button" data-i="' + i + '" aria-label="Apagar esta foto">✕</button></figure>').join("");
  };
  pinta();

  return await new Promise(pronto => {
    const solta = () => {
      disp.onclick = null; tiras.onclick = null; $("#camok").onclick = null; $("#camsai").onclick = null;
      document.removeEventListener("keydown", tecla);
      novas.forEach(f => { try { URL.revokeObjectURL(f.url); } catch (e) {} });
      camFecha();
    };
    const fim = entrega => { const r = entrega ? novas.map(f => f.file) : []; solta(); pronto(r); };
    const tecla = ev => { if (ev.key === "Escape") fim(true); };

    disp.onclick = async () => {
      if (jaTinha + novas.length >= limite) return;
      const c = camQuadro(video);
      if (!c) return toast("A câmera ainda está abrindo. Tente de novo em um segundo.");
      flash.classList.remove("on"); void flash.offsetWidth; flash.classList.add("on");
      const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
      if (!blob) return toast("Não consegui guardar essa foto. Tente de novo.");
      const file = camArquivo(blob, jaTinha + novas.length + 1);
      novas.push({ file, url: URL.createObjectURL(blob) });
      pinta();
    };
    tiras.onclick = ev => {
      const b = ev.target.closest("button[data-i]"); if (!b) return;
      const [f] = novas.splice(+b.dataset.i, 1);
      if (f) { try { URL.revokeObjectURL(f.url); } catch (e) {} }
      pinta();
    };
    $("#camok").onclick = () => fim(true);
    $("#camsai").onclick = () => fim(false);
    document.addEventListener("keydown", tecla);
  });
}

/* ============ 2. ler as paginas de estudo ============ */
/* O conteudo passa a ser guardado em BLOCOS por assunto, com a identificacao do
   material (sistema/volume/edicao) e a pagina apenas como referencia. ex.content
   vira derivado dos blocos, para tudo que ja existia continuar funcionando. */
const normTxt = t => String(t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
function hash32(t) { const n = normTxt(t); let h = 5381; for (let i = 0; i < n.length; i++) h = ((h << 5) + h + n.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
const cutStr = (v, n) => String(v == null ? "" : v).trim().slice(0, n);
const MATF = ["sistema", "volume", "edicao", "serie"];
function seedBlocks(ex) {
  if (Array.isArray(ex.blocks)) return;
  ex.blocks = ex.content ? [{ materia: ex.subject, assunto: "", pagina: "", conceitos: [], texto: ex.content, hash: hash32(ex.content) }] : [];
}
function deriveContent(ex) {
  ex.content = ex.blocks.map(b => (b.assunto ? b.assunto + (b.pagina ? " (p. " + b.pagina + ")" : "") + "\n" : "") + b.texto).join("\n\n").slice(0, MAX_CONTENT);
}
function addBlocks(ex, material, blocks) {
  seedBlocks(ex);
  if (material) { ex.material = ex.material || { sistema: "", volume: "", edicao: "", serie: "" }; MATF.forEach(k => { if (!ex.material[k] && material[k]) ex.material[k] = cutStr(material[k], 60); }); }
  let added = 0, unreadable = 0;
  for (const b of blocks || []) {
    const texto = cutStr(b && b.conteudo, 6000); if (!texto) continue;
    const assunto = cutStr(b.assunto, 120);
    if (/ILEG[I\u00cd]VEL/i.test(assunto) || /ILEG[I\u00cd]VEL/i.test(texto)) { unreadable++; continue; }
    const h = hash32(texto); if (ex.blocks.some(x => x.hash === h)) continue;
    ex.blocks.push({ materia: cutStr(b.materia || ex.subject, 60), assunto, pagina: cutStr(b.pagina, 12), conceitos: (Array.isArray(b.conceitos) ? b.conceitos : []).map(c => cutStr(c, 60)).filter(Boolean).slice(0, 12), texto, hash: h });
    added++;
  }
  deriveContent(ex); return { added, unreadable };
}
function cov(ex) { try { return coverage(ex); } catch (e) { return null; } }
function matLabel(ex) { const m = ex && ex.material; if (!m) return ""; return MATF.map(k => m[k]).filter(Boolean).join(" \u00b7 "); }
function addText(ex, titulo, texto) { return addBlocks(ex, null, [{ materia: ex.subject, assunto: titulo, pagina: "", conceitos: [], conteudo: texto }]); }

function pagesPrompt(ex, extraText) {

function pagesPromptJSON(ex, extraText) {

    "2) DIVIDA O CONTE\u00daDO EM BLOCOS, um por assunto. Cada bloco traz uma transcri\u00e7\u00e3o condensada e FIEL: conceitos, defini\u00e7\u00f5es, regras, exemplos resolvidos, f\u00f3rmulas, datas, nomes, vocabul\u00e1rio, e uma frase descrevendo mapas, gr\u00e1ficos ou figuras importantes. Ignore enfeites e instru\u00e7\u00f5es de atividade sem conte\u00fado. N\u00e3o acrescente nada que n\u00e3o esteja nas p\u00e1ginas.\n" +

    "Responda SOMENTE com JSON: {\"material\":{\"sistema\":\"\",\"volume\":\"\",\"edicao\":\"\",\"serie\":\"\"},\"blocos\":[{\"materia\":\"\",\"assunto\":\"\",\"pagina\":\"\",\"conceitos\":[\"\"],\"conteudo\":\"\"}]}" +
    (extraText ? "\n\nTEXTO:\n" + extraText.slice(0, 40000) : "");

/* tenta o formato estruturado; se falhar, cai no texto corrido de antes (sem regressao) */
async function readChunk(ex, extraText, images) {
  const opts = images && images.length ? { images } : {};
  try {
    const r = await askJSON(pagesPromptJSON(ex, extraText), opts);
    const blocos = r && Array.isArray(r.blocos) ? r.blocos.filter(b => b && b.conteudo) : [];
    if (!blocos.length) throw { code: "invalid_json" };
    return { material: (r && r.material) || null, blocos };
  } catch (e) {
    if (e.code === "cancelled") throw e;
    const t = await askText(pagesPrompt(ex, extraText), opts);
    return { material: null, blocos: [{ materia: ex.subject, assunto: "", pagina: "", conceitos: [], conteudo: t }] };
  }
}

    let count = 0, unreadable = 0, added = 0;
    if (g.text) { busy("Lendo o material\u2026"); const r = await readChunk(ex, g.text, null); const a = addBlocks(ex, r.material, r.blocos); added += a.added; unreadable += a.unreadable; count += (g.text.match(/\[P\u00e1gina/g) || [1]).length; }
    const per = Math.min(3, Math.max(1, imgMax()));

      const r = await readChunk(ex, "", part); const a = addBlocks(ex, r.material, r.blocos); added += a.added; unreadable += a.unreadable; count += part.length;
    }
    ex.nPages = (ex.nPages || 0) + count; ui.files = []; ui.screen = null; save(); idle();

  } catch (e) { idle(); if (e.code !== "cancelled") toast(errMsg(e)); }
}

function chooseBox(msg, opts, sub) { ui.confirm = { msg, opts, sub }; }
/* ============ ritmo de estudo (por crianca) ============ */
/* Teto diario = quanto tempo a crianca tem por dia, somando as materias.
   Ritmo = quanto conteudo cabe DENTRO de uma sessao. Sao coisas diferentes. */
const PACE = {
  calmo:  { label: "Calmo",  min: 15, max: 20, pags: 4,  dica: "Para quem precisa de mais tempo: peda\u00e7os pequenos e mais repeti\u00e7\u00e3o." },
  normal: { label: "Normal", min: 20, max: 30, pags: 8,  dica: "O padr\u00e3o: sess\u00f5es de 20 a 30 minutos." },
  puxado: { label: "Puxado", min: 25, max: 40, pags: 14, dica: "Para quem absorve r\u00e1pido: blocos maiores por sess\u00e3o." },
};
const PACEK = ["calmo", "normal", "puxado"];
function paceOf(k) { k = k || kid(); const p = k && k.pace; return PACE[p] ? p : "normal"; }
function paceRules(p) {
  const P = PACE[p];
  if (p === "calmo") return "RITMO CALMO: esta crian\u00e7a precisa de mais tempo para absorver. Sess\u00f5es de " + P.min + " a " + P.max + " minutos. Divida o conte\u00fado em MUITAS partes pequenas: cada sess\u00e3o cobre um peda\u00e7o curto, por volta de " + P.pags + " p\u00e1ginas ou um assunto s\u00f3. Prefira mais sess\u00f5es curtas a menos sess\u00f5es longas. De 3 a 4 passos por sess\u00e3o, e um deles sempre de repetir ou explicar em voz alta o que entendeu.";
  if (p === "puxado") return "RITMO PUXADO: esta crian\u00e7a absorve r\u00e1pido. Sess\u00f5es de " + P.min + " a " + P.max + " minutos, cobrindo blocos maiores, por volta de " + P.pags + " p\u00e1ginas por sess\u00e3o. De 2 a 3 passos por sess\u00e3o, diretos.";
  return "RITMO NORMAL: sess\u00f5es de " + P.min + " a " + P.max + " minutos, cobrindo por volta de " + P.pags + " p\u00e1ginas cada. De 2 a 4 passos por sess\u00e3o.";
}
/* conjunto de paginas a partir do que a professora (ou a IA) escreveu:
   "120 a 153", "40-52", "12, 15 e 18", "120-121" (foto de duas paginas) */
function pageSet(str) {
  const out = new Set();
  String(str || "")
    .replace(/(\d{1,4})\s*(?:a|à|até|-|–|—)\s*(\d{1,4})/gi, (m, a, b) => {
      const x = +a, y = +b; if (y >= x && y - x < 400) for (let i = x; i <= y; i++) out.add(i);
      return " ";
    })
    .replace(/\d{1,4}/g, n => { out.add(+n); return " "; });
  return out;
}
function pageCount(str) { return pageSet(str).size; }
/* junta numeros soltos em intervalos legiveis: [135,136,137,146] -> "135 a 137, 146" */
function faixas(nums) {
  const out = []; let i = 0;
  while (i < nums.length) {
    let j = i; while (j + 1 < nums.length && nums[j + 1] === nums[j] + 1) j++;
    out.push(i === j ? String(nums[i]) : nums[i] + " a " + nums[j]); i = j + 1;
  }
  return out.join(", ");
}
/* compara as paginas pedidas no comunicado com as que realmente entraram.
   Uma foto pode trazer duas paginas, entao contar fotos nao serve: conta
   numero de pagina mesmo, e so avisa quando falta um numero especifico. */
function coverage(ex) {
  const quer = pageSet(ex.pages); if (!quer.size) return null;
  seedBlocks(ex);
  const tem = new Set();
  ex.blocks.forEach(b => pageSet(b.pagina).forEach(n => tem.add(n)));
  if (!tem.size) return null;
  const falta = [...quer].filter(n => !tem.has(n)).sort((a, b) => a - b);
  if (!falta.length) return null;
  return { want: quer.size, got: quer.size - falta.length, falta, texto: faixas(falta) };
}

/* estimativa grosseira de quanto cabe ate a prova, no ritmo escolhido */
function fitCheck(ex, t, p) {
  const days = studyDays(t, addDays(ex.date, -1)).length, pg = pageCount(ex.pages);
  if (!days || !pg) return null;

async function makePlan(onlyId, opts) {
  const k = kid(), t = today(); onlyId = typeof onlyId === "string" ? onlyId : null; opts = opts || {};
  const exams = k.exams.filter(e => validD(e.date) && e.date > t && (!onlyId || e.id === onlyId));
  if (!exams.length) return toast(onlyId ? "Essa prova precisa de uma data a partir de amanh\u00e3 para entrar no roteiro." : k.exams.length ? "Nenhuma prova com data a partir de amanh\u00e3. Confira as datas." : "Adicione as provas primeiro.");
  const kept = k.sessions.filter(s => s.done || (onlyId && s.examId !== onlyId));
  const pace = PACE[opts.pace] ? opts.pace : paceOf();
  let sessions = [], usedAI = false;
  if (temIA()) {
    busy(onlyId ? "Montando o roteiro de " + exams[0].subject + "\u2026" : "Montando o roteiro\u2026", "Isso leva at\u00e9 um minuto.");
    try {
      const r = await askJSON(planPrompt(exams, t, pace, opts), { cache: false });
      const por = {};
      for (const s of (r && r.sessoes) || []) {
        const ex = exams.find(e => e.id === s.prova_id); if (!ex) continue;
        const steps = (Array.isArray(s.passos) ? s.passos : []).filter(x => typeof x === "string" && x.trim());
        if (!steps.length) continue;
        (por[ex.id] = por[ex.id] || []).push({ ex, tipo: s.tipo === "revisao" ? "revisao" : "estudo", titulo: s.titulo || ex.subject, minutos: s.minutos, steps, ordem: Number(s.ordem) || 99 });
      }
      for (const id of Object.keys(por)) {
        const lista = por[id].sort((a, b) => a.ordem - b.ordem);
        lista.forEach((x, i) => sessions.push(mkSession(x.ex, x.tipo === "revisao" ? addDays(x.ex.date, -1) : null, x.tipo, x.titulo, x.minutos, x.steps, i + 1)));
      }
      usedAI = sessions.length > 0;
    } catch (e) { if (e.code === "cancelled") return idle(); toast(errMsg(e) + " Montei um roteiro simples no lugar."); }
  }
  for (const ex of exams) if (!sessions.some(s => s.examId === ex.id)) sessions.push(...basicSessions(ex, pace));
  k.sessions = kept.concat(sessions).sort((a, b) => {
    const da = (k.exams.find(e => e.id === a.examId) || {}).date || "9", db = (k.exams.find(e => e.id === b.examId) || {}).date || "9";
    return da.localeCompare(db) || (a.ord || 0) - (b.ord || 0);
  });
  k.planAt = t; save(); ui.tab = "hoje"; ui.screen = null; idle();
  if (usedAI || !temIA()) toast(onlyId ? "Roteiro de " + exams[0].subject + " pronto!" : "Roteiro pronto!");
}

/* ============ compressao dos codigos ============ */
/* O navegador ja sabe comprimir (CompressionStream). O codigo sai com o
   prefixo SDP1: para o app reconhecer. Codigo antigo (texto puro, comecando
   com "{") continua sendo aceito, entao nada do que ja foi salvo quebra. */
const MARCA = "SDP1:";
const b64enc = u8 => { let s = ""; const C = 0x8000; for (let i = 0; i < u8.length; i += C) s += String.fromCharCode.apply(null, u8.subarray(i, i + C)); return btoa(s); };
const b64dec = b => { const s = atob(String(b).replace(/\s+/g, "")); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; };
async function zipar(txt) {
  if (typeof CompressionStream === "undefined") return txt;
  try {
    const cs = new CompressionStream("gzip"), w = cs.writable.getWriter();
    w.write(new TextEncoder().encode(txt)); w.close();
    const buf = await new Response(cs.readable).arrayBuffer();
    const out = MARCA + b64enc(new Uint8Array(buf));
    return out.length < txt.length ? out : txt;
  } catch (e) { return txt; }
}
async function dezipar(txt) {
  txt = String(txt || "").trim();
  if (txt.slice(0, MARCA.length) !== MARCA) return txt;
  const ds = new DecompressionStream("gzip"), w = ds.writable.getWriter();
  w.write(b64dec(txt.slice(MARCA.length))); w.close();
  return await new Response(ds.readable).text();
}
/* le um codigo colado e diz o que ele e */
async function lerCodigo(raw) {
  const txt = await dezipar(raw);
  const o = JSON.parse(txt);
  if (o && Array.isArray(o.kids)) return { tipo: "copia", dados: o };
  if (o && o.turma === 1 && Array.isArray(o.provas)) return { tipo: "turma", dados: o };
  throw new Error("desconhecido");
}

/* Ler dois comunicados sobre a mesma prova (o calendario geral e o da

function repetidas() {

/* junta o grupo na prova escolhida, preservando o que cada uma trouxe */
function juntarEm(idEscolhida) {
  const k = kid(), base = examOf(idEscolhida); if (!base) return null;
  const outras = k.exams.filter(e => e.id !== base.id && e.subject.trim().toLowerCase() === base.subject.trim().toLowerCase());
  if (!outras.length) return null;
  for (const o of outras) {
    if (!base.topics && o.topics) base.topics = o.topics;
    else if (o.topics && base.topics && !base.topics.includes(o.topics.slice(0, 40))) base.topics = (base.topics + " " + o.topics).slice(0, 800);
    if (!base.pages && o.pages) base.pages = o.pages;
    else if (o.pages && base.pages && !base.pages.includes(o.pages.slice(0, 12))) base.pages = (base.pages + "; " + o.pages).slice(0, 300);
    const atuais = linksOf(base);
    linksOf(o).forEach(l => { if (!atuais.some(x => x.url === l.url)) atuais.push(l); });
    base.links = atuais.slice(0, 8);
    seedBlocks(o); seedBlocks(base);
    const novos = o.blocks.filter(b => !base.blocks.some(x => x.hash === b.hash));
    if (novos.length) { base.blocks = base.blocks.concat(novos); base.nPages = (base.nPages || 0) + novos.length; deriveContent(base); }
    if (!base.material && o.material) base.material = o.material;
    base.misses = base.misses.concat(o.misses || []).slice(-20);
    base.asked = base.asked.concat(o.asked || []).slice(-40);
    /* roteiro: so herda se a escolhida ainda nao tem um */
    if (!k.sessions.some(s => s.examId === base.id)) k.sessions.forEach(s => { if (s.examId === o.id) s.examId = base.id; });
  }
  const ids = outras.map(e => e.id);
  k.exams = k.exams.filter(e => !ids.includes(e.id));
  k.sessions = k.sessions.filter(s => !ids.includes(s.examId));
  k.exams.sort((a, b) => (a.date || "9").localeCompare(b.date || "9"));
  save();
  return { juntadas: outras.length, materia: base.subject };
}

/* ============ codigo da turma ============ */
/* Leva SO o que e da turma: provas, datas, assuntos, paginas, links, material
   condensado e o roteiro base. Nunca leva nome, progresso, notas nem erros da
   crianca - isso e da familia e fica no aparelho. Ao colar, SOMA ao que ja
   existe em vez de substituir: o progresso de quem recebe nao e tocado. */
function codigoTurma(comMaterial) {
  const k = kid();
  return JSON.stringify({
    turma: 1, serie: k.grade, em: today(),
    provas: k.exams.map(e => ({
      m: e.subject, d: e.date, t: e.topics, p: e.pages,
      l: linksOf(e).map(x => ({ u: x.url, r: x.label })),
      mat: e.material || null,
      b: comMaterial ? (e.blocks || []).map(b => ({ a: b.assunto, pg: b.pagina, c: b.conceitos || [], x: b.texto, h: b.hash })) : [],
      r: k.sessions.filter(s => s.examId === e.id).sort((a, b) => (a.ord || 0) - (b.ord || 0))
        .map(s => ({ o: s.ord, tp: s.type, ti: s.title, mi: s.minutes, ps: s.steps.map(y => y.t) })),
    })),
  });
}
function importarTurma(o) {
  if (!o || o.turma !== 1 || !Array.isArray(o.provas)) throw new Error("formato");
  const k = kid(); let novas = 0, somadas = 0, comRot = 0, comMat = 0;
  for (const p of o.provas) {
    const mat = cutStr(p.m, 60); if (!mat) continue;
    const data = validD(p.d) ? p.d : "";
    let e = k.exams.find(x => x.subject.toLowerCase() === mat.toLowerCase() && x.date === data);
    if (!e) {
      e = { id: uid(), subject: mat, date: data, topics: cutStr(p.t, 800), pages: cutStr(p.p, 300), links: [], content: "", blocks: [], material: null, nPages: 0, misses: [], asked: [] };
      k.exams.push(e); novas++;
    } else {
      somadas++;
      if (!e.topics && p.t) e.topics = cutStr(p.t, 800);
      if (!e.pages && p.p) e.pages = cutStr(p.p, 300);
    }
    /* links novos somam, sem duplicar */
    const atuais = linksOf(e);
    for (const l of Array.isArray(p.l) ? p.l : []) {
      const u = cleanUrl(l && l.u); if (!u || atuais.some(x => x.url === u)) continue;
      atuais.push({ url: u, label: cutStr(l.r, 80) });
    }
    e.links = atuais.slice(0, 8);
    /* material condensado: soma os blocos que ainda nao existem */
    const blocos = (Array.isArray(p.b) ? p.b : []).map(b => ({ materia: mat, assunto: cutStr(b && b.a, 120), pagina: cutStr(b && b.pg, 12), conceitos: Array.isArray(b && b.c) ? b.c : [], conteudo: cutStr(b && b.x, 6000) })).filter(b => b.conteudo);
    if (blocos.length) { const r = addBlocks(e, p.mat || null, blocos); if (r.added) { comMat++; e.nPages = (e.nPages || 0) + r.added; } }
    else if (p.mat && !e.material) { e.material = { sistema: cutStr(p.mat.sistema, 60), volume: cutStr(p.mat.volume, 60), edicao: cutStr(p.mat.edicao, 60), serie: cutStr(p.mat.serie, 60) }; }
    /* roteiro base: so entra se esta prova ainda nao tem roteiro aqui */
    const jaTem = k.sessions.some(s => s.examId === e.id);
    const partes = (Array.isArray(p.r) ? p.r : []).filter(x => x && Array.isArray(x.ps) && x.ps.length);
    if (!jaTem && partes.length) {
      partes.sort((a, b) => (a.o || 0) - (b.o || 0)).forEach((x, i) => {
        const rev = x.tp === "revisao";
        k.sessions.push(mkSession(e, rev && validD(e.date) ? addDays(e.date, -1) : null, rev ? "revisao" : "estudo", cutStr(x.ti, 90) || mat, x.mi, x.ps.map(y => cutStr(y, 220)), i + 1));
      });
      comRot++;
    }
  }
  k.exams.sort((a, b) => (a.date || "9").localeCompare(b.date || "9"));
  k.sessions.sort((a, b) => {
    const da = (k.exams.find(e => e.id === a.examId) || {}).date || "9", db = (k.exams.find(e => e.id === b.examId) || {}).date || "9";
    return da.localeCompare(db) || (a.ord || 0) - (b.ord || 0);
  });
  save();
  return { novas, somadas, comRot, comMat };
}

  copt(d) { const o = ui.confirm && ui.confirm.opts && ui.confirm.opts[+d.i]; ui.confirm = null; if (o && o.fn) return o.fn(); },
  cno() { ui.confirm = null; },
  cyes() { const f = ui.confirm && ui.confirm.yes; ui.confirm = null; if (f) return f(); },
  punlock() { const v = ($("#pin") ? $("#pin").value : "").trim(); if (v !== PINV) return toast("Senha errada."); ui.unlocked = true; ui.riddle = null; },
  pforgot() { newRiddle(); },
  rcancel() { ui.riddle = null; },
  rsolve() { const r = ui.riddle, v = ($("#rans") ? $("#rans").value : "").replace(/\D/g, ""); if (!r) return; if (+v !== r.a * r.b) { newRiddle(); return toast("N\u00e3o \u00e9 esse. Tente a conta nova."); } PINV = ""; savePin(); ui.unlocked = true; ui.riddle = null; toast("Senha removida. Escolha uma nova em Pais."); },
  pset() { const v = ($("#pnew") ? $("#pnew").value : "").replace(/\D/g, ""); if (v.length !== 4) return toast("A senha precisa ter 4 n\u00fameros."); PINV = v; savePin(); ui.unlocked = true; toast("Senha guardada. Anote em algum lugar seguro."); },
  poff() { confirmBox("Tirar a senha dos pais? Seu filho vai poder entrar aqui.", () => { PINV = ""; savePin(); }, "Tirar"); },
  pprovas() { ui.screen = "pprovas"; ui.form = {}; window.scrollTo(0, 0); },
  pprog() { ui.screen = "pprog"; window.scrollTo(0, 0); },
  pajustes() { ui.screen = "pajustes"; window.scrollTo(0, 0); },
  pia() { ui.screen = "pia"; window.scrollTo(0, 0); },
  pavancado() { ui.screen = "pavancado"; ui.form = {}; window.scrollTo(0, 0); },
  pcompartilhar() { ui.screen = "pcompartilhar"; ui.form = {}; window.scrollTo(0, 0); },
  ppais() { ui.screen = null; ui.form = {}; window.scrollTo(0, 0); },
  examdet(d) { ui.arg = d.id; ui.screen = "examdet"; window.scrollTo(0, 0); },
  async iocopy() { copiar(await zipar(JSON.stringify(S)), "Código copiado! Mande para você mesma e cole no outro aparelho."); },
  async iolite() { copiar(await zipar(estadoLeve()), "Cópia leve copiada! No outro aparelho, reenvie as fotos das páginas."); },
  async ioshare() { compartilhar(await zipar(JSON.stringify(S)), "Semana de Prova — cópia de segurança"); },
  gshow() { ui.showKey = ui.showKey === "g" ? null : "g"; },
  rshow() { ui.showKey = ui.showKey === "r" ? null : "r"; },
  gcopy() { copiar(G.key || "", "Chave do Gemini copiada. Cole no outro aparelho, em Pais."); },
  rcopy() { copiar(R.key || "", "Chave do Groq copiada."); },
  async tcopy() { copiar(await zipar(codigoTurma(true)), "Código da turma copiado! Mande no grupo da sala."); },
  async tcopylite() { copiar(await zipar(codigoTurma(false)), "Copiado sem o material lido."); },
  tpaste() { ui.form.turma = ui.form.turma === "paste" ? null : "paste"; },
  async tdoimport() { let o; try { o = (await lerCodigo($("#tio").value)).dados; } catch (e) { render(); return toast("Esse código não é válido."); }
    if (!o || o.turma !== 1) return toast("Esse código não é de turma. O código da turma começa com {\"turma\":1.");
    try { const r = importarTurma(o); ui.form.turma = null;
      render(); toast(r.novas + " prova(s) nova(s)" + (r.somadas ? ", " + r.somadas + " já existia(m)" : "") + (r.comRot ? ", " + r.comRot + " com roteiro pronto" : "") + (r.comMat ? ", " + r.comMat + " com material" : "") + "."); }
    catch (e) { toast("Não consegui ler esse código."); } },
  wnovo() { ui.form = { passo: "novo" }; },
  wcodigo() { ui.form = { passo: "codigo" }; },
  wback() { ui.form = {}; },
  async wgo() {
    const raw = ($("#wio") ? $("#wio").value : ui.form.wio || "").trim();
    if (raw.length < 10) return toast("Cole o código primeiro.");
    let r; try { r = await lerCodigo(raw); } catch (e) { return toast("Não consegui ler esse código. Confira se copiou inteiro."); }
    if (r.tipo === "copia") { S = r.dados; S.settings = S.settings || { minutes: 45, weekends: true }; save(); ui.screen = null; ui.form = {}; ui.tab = "hoje"; render(); return toast("Tudo restaurado neste aparelho!"); }
    if (!kid()) {
      if (!ui.form.pedeNome) { ui.form = { passo: "codigo", wio: raw, pedeNome: true, serieSugerida: r.dados.serie || "" }; render(); return; }
      const nome = ($("#kname") ? $("#kname").value : ui.form.name || "").trim(); if (!nome) return toast("Escreva o nome ou apelido da criança.");
      const serie = $("#kgrade") ? $("#kgrade").value : ui.form.grade, ritmo = $("#kpace") ? $("#kpace").value : ui.form.pace;
      const nk = { id: uid(), name: nome.slice(0, 20), grade: serie || r.dados.serie || "5º ano", pace: PACE[ritmo] ? ritmo : "normal", exams: [], sessions: [], planAt: null };
      S.kids.push(nk); S.active = nk.id; save();
    }
    const res = importarTurma(r.dados); ui.screen = null; ui.form = {}; ui.tab = "hoje"; render();
    toast(res.novas + " prova(s) chegaram" + (res.comRot ? " com o roteiro pronto" : "") + ". Bons estudos!");
  },
  async srvsave() {
    const url = ($("#surl") ? $("#surl").value : "").trim().replace(/\/+$/, "");
    const cod = ($("#scod") ? $("#scod").value : "").trim();
    if (!/^https:\/\/[^\s]+\./.test(url)) return toast("Cole o endereço inteiro do servidor, começando com https://");
    if (!cod) return toast("Falta o código de acesso.");
    const antes = SRV; SRV = { url, codigo: cod, id: (antes && antes.id) || uid() + uid() }; saveSrv();
    busy("Testando o servidor…");
    try { await servidor("Responda apenas: ok", {}, false); idle(); toast("Servidor ligado! Este aparelho não precisa mais de chave."); }
    catch (e) { SRV = antes || {}; saveSrv(); idle(); toast(errMsg(e)); }
  },
  srvoff() { confirmBox("Desligar o servidor neste aparelho?", () => { SRV = { id: SRV.id }; saveSrv(); }, "Desligar"); },
  juntar(d) { ui.arg = d.m; ui.screen = "juntar"; window.scrollTo(0, 0); },
  juntarok(d) { const e = examOf(d.id); if (!e) return;
    confirmBox("Manter " + e.subject + " em " + (validD(e.date) ? nice(e.date) : "sem data") + " e juntar as outras nesta?", () => {
      const r = juntarEm(d.id); ui.screen = "pprovas";
      toast(r ? r.juntadas + " entrada(s) de " + r.materia + " juntada(s). Confira a data e monte o roteiro." : "Nada para juntar.");
    }, "Juntar"); },
  clearlog() { LOG = []; saveLog(); },
  export() { ui.form.io = ui.form.io === "export" ? null : "export"; },
  import() { ui.form.io = ui.form.io === "import" ? null : "import"; },
  async doimport() { let s2; try { const rr = await lerCodigo($("#io").value); if (rr.tipo !== "copia") throw 0; s2 = rr.dados; } catch (e) { render(); return toast("Esse c\u00f3digo n\u00e3o \u00e9 v\u00e1lido. Se for c\u00f3digo de turma, use Provas e material."); }
    const nomes = s2.kids.map(x => x.name).join(", ") || "ningu\u00e9m";
    const atual = S.kids.map(x => x.name).join(", ") || "ningu\u00e9m";
    chooseBox("Restaurar a c\u00f3pia?", [
      { label: "Primeiro salvar o que est\u00e1 aqui", pri: true, fn: () => { ui.form.io = "export"; toast("Copie este c\u00f3digo antes. Depois cole o outro e restaure."); } },
      { label: "Substituir mesmo assim", fn: () => { S = s2; S.settings = S.settings || { minutes: 45, weekends: true }; save(); ui.form = {}; toast("Dados restaurados."); } },
    ], "O c\u00f3digo traz: " + nomes + ". Vai substituir o que est\u00e1 neste aparelho: " + atual + ". A chave da IA n\u00e3o \u00e9 afetada. N\u00e3o tem como desfazer.");
  },
  
};
document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-a]"); if (!b || b.disabled) return;
  keepForm(); const fn = A[b.dataset.a]; if (!fn) return;
  fn(b.dataset); render();
});
document.addEventListener("change", ev => {
  const c = ev.target.dataset && ev.target.dataset.c; if (!c) return;
  if (c === "minutes") S.settings.minutes = +ev.target.value;
  if (c === "weekends") S.settings.weekends = ev.target.checked;
  if (c === "pace") { const kk = S.kids.find(x => x.id === ev.target.dataset.id); if (kk) kk.pace = PACE[ev.target.value] ? ev.target.value : "normal"; }
  if (c === "modo") { const v = String(ev.target.value); DEV = v.slice(0, 2) === "k:" ? { modo: "crianca", kid: v.slice(2) } : { modo: "mae" }; saveDev(); }
  save(); if (c === "pace" || c === "modo") render();
});
document.addEventListener("focusin", ev => { if (ev.target.id === "io" && ev.target.readOnly) ev.target.select(); });
render();
</script>
