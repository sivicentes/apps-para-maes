<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Semana de Prova</title>
<meta name="theme-color" content="#2B59E0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#EEF3FA; --card:#FFFFFF; --ink:#1B2A4E; --ink2:#56637F; --line:#D3DDEC;
  --blue:#2B59E0; --on-blue:#FFFFFF; --blue-soft:#E3EAFD;
  --mark:#FFDF5E; --ok:#15885A; --ok-bg:#DFF5EA; --bad:#CF3640; --bad-bg:#FCE4E6;
  --shadow:0 2px 0 rgba(27,42,78,.10);
  --display:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#10182B; --card:#1A2440; --ink:#EAF0FF; --ink2:#A7B3D0; --line:#2D3A61;
    --blue:#86A6FF; --on-blue:#0D1630; --blue-soft:#24325C;
    --mark:#8A6F00; --ok:#5FD3A2; --ok-bg:#143627; --bad:#FF8A92; --bad-bg:#43191D;
    --shadow:0 2px 0 rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --paper:#10182B; --card:#1A2440; --ink:#EAF0FF; --ink2:#A7B3D0; --line:#2D3A61;
  --blue:#86A6FF; --on-blue:#0D1630; --blue-soft:#24325C;
  --mark:#8A6F00; --ok:#5FD3A2; --ok-bg:#143627; --bad:#FF8A92; --bad-bg:#43191D;
  --shadow:0 2px 0 rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0}
h1{font-size:1.75rem;font-weight:800}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.12rem;font-weight:700}
p{margin:.4em 0}
.mk{background:linear-gradient(transparent 52%,var(--mark) 52%,var(--mark) 92%,transparent 92%);padding:0 .15em;border-radius:2px}
#app{max-width:640px;margin:0 auto;padding:14px 16px 110px}
.muted{color:var(--ink2)}
.small{font-size:.88rem}

/* cabeçalho */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.kids{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.92rem}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}

/* régua da semana */
.ruler{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;margin:0 -2px 8px;scrollbar-width:none}
.ruler::-webkit-scrollbar{display:none}
.day{flex:0 0 58px;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:6px 2px 8px;text-align:center;position:relative}
.day .wd{font-size:.74rem;font-weight:700;color:var(--ink2)}
.day .dn{font-family:var(--display);font-weight:800;font-size:1.3rem;line-height:1.1}
.day .dots{display:flex;justify-content:center;gap:3px;min-height:9px;margin-top:3px}
.dot{width:8px;height:8px;border-radius:50%;border:2px solid var(--blue)}
.dot.f{background:var(--blue)}
.day.today{border-color:var(--ink)}
.day[aria-pressed="true"]{background:var(--mark);border-color:var(--ink)}
.day[aria-pressed="true"] .wd{color:var(--ink)}
.flag{position:absolute;top:-7px;right:-4px;background:var(--bad);color:#fff;font-size:.62rem;font-weight:800;border-radius:6px;padding:1px 5px}

/* cartões */
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin:10px 0;box-shadow:var(--shadow)}
.card.tap{display:block;width:100%;text-align:left}
.card.done{opacity:.72}
.card.alert{border-color:var(--bad);background:var(--bad-bg)}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.tag{display:inline-block;font-size:.76rem;font-weight:800;border-radius:8px;padding:2px 8px;background:var(--blue-soft);color:var(--ink)}
.tag.rev{background:var(--mark);color:var(--ink)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.check{flex:0 0 30px;height:30px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;font-weight:800;background:var(--card)}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);background:var(--card);border-radius:14px;padding:11px 16px;font-weight:800;min-height:48px;box-shadow:var(--shadow)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.ghost{border-color:var(--line);box-shadow:none;font-weight:700}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.link{background:none;border:0;padding:4px 0;color:var(--blue);font-weight:700;text-decoration:underline}

/* formulários */
label{display:block;font-weight:700;font-size:.92rem;margin:10px 0 4px}
input[type=text],input[type=password],input[type=date],select,textarea{width:100%;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;min-height:46px}
textarea{min-height:88px;resize:vertical}

/* passos */
.step{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;padding:9px 0;border-bottom:1.5px dashed var(--line)}
.step:last-child{border-bottom:0}
.step.on span:last-child{text-decoration:line-through;color:var(--ink2)}
.explain{white-space:pre-wrap;background:var(--blue-soft);border-radius:14px;padding:12px 14px;margin-top:10px}

/* quiz */
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;margin:8px 0;font-weight:600;min-height:52px}
.opt .l{flex:0 0 28px;height:28px;border-radius:8px;background:var(--blue-soft);display:grid;place-items:center;font-weight:800}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 14px}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .3s}
.score{font-family:var(--display);font-size:3.2rem;font-weight:800;line-height:1}

/* navegação */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:6px;z-index:5}
.nav button{flex:1;max-width:200px;border:0;background:none;border-radius:12px;padding:6px 4px;font-weight:800;font-size:.86rem;color:var(--ink2);min-height:52px}
.nav button .ic{display:block;font-size:1.3rem;line-height:1.2}
.nav button[aria-current="page"]{color:var(--ink);background:var(--mark)}
@media (prefers-color-scheme:dark){.nav button[aria-current="page"]{color:#fff}}

/* ocupado */
.veil{position:fixed;inset:0;background:rgba(16,24,43,.55);display:grid;place-items:center;z-index:20;padding:20px}
.veil .card{max-width:360px;text-align:center}
.pencil{font-size:2.4rem;display:inline-block;animation:wig 1s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg) translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.pencil{animation:none}.bar i{transition:none}}
.toast[hidden]{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 16px;font-weight:700;z-index:30;max-width:90%}
.links h3{margin:4px 0 6px}
.lk{display:flex;gap:10px;align-items:center;border:2px solid var(--blue);background:var(--blue-soft);color:var(--ink);border-radius:14px;padding:10px 12px;margin:8px 0;text-decoration:none;min-height:52px}
.lk .ic{font-size:1.5rem}
.lk .u{display:block;font-size:.76rem;color:var(--ink2);word-break:break-all;user-select:all;-webkit-user-select:all}
.note{border-left:5px solid var(--mark);padding:6px 12px;margin:10px 0;background:var(--card);border-radius:0 12px 12px 0}
ul.plain{margin:.3em 0;padding-left:1.2em}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" hidden></div>
<input type="file" id="file" accept="image/*,application/pdf,.pdf,.docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" multiple hidden>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>

<script>
"use strict";
/* ============ utilidades ============ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const pad = n => String(n).padStart(2, "0");
const dstr = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const parseD = s => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const validD = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s)) && !isNaN(parseD(s));
const today = () => dstr(new Date());
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return dstr(d); };
const WD = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
const WDL = ["domingo", "segunda-feira", "terça-feira", "quarta-feira", "quinta-feira", "sexta-feira", "sábado"];
const nice = s => { const d = parseD(s); return WDL[d.getDay()] + ", " + d.getDate() + "/" + pad(d.getMonth() + 1); };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const SERIES = ["1º ano", "2º ano", "3º ano", "4º ano", "5º ano", "6º ano", "7º ano", "8º ano", "9º ano"];
const MAX_CONTENT = 16000;
function cleanUrl(u) { u = String(u || "").trim().replace(/[)\].,;]+$/, ""); if (/^(www\.|youtu\.?be|[a-z0-9-]+\.(com|org|net|br)\b)/i.test(u)) u = "https://" + u; return /^https?:\/\/[^\s<>"']{4,}$/i.test(u) ? u.slice(0, 500) : ""; }
const isVideo = u => /youtube\.com|youtu\.be|vimeo\.com/i.test(u);
const ytId = u => { const m = /(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/|\/live\/)([\w-]{11})/.exec(String(u)); return m ? m[1] : ""; };
const linksOf = e => (e && Array.isArray(e.links) ? e.links : []);
const hasVideo = e => linksOf(e).some(l => isVideo(l.url));
const aiLinks = p => (Array.isArray(p && p.links) ? p.links : []).map(l => ({ url: cleanUrl(l && l.url), label: String((l && l.descricao) || "").slice(0, 80) })).filter(l => l.url).slice(0, 8);
function parseLinks(txt) { const out = []; String(txt || "").split(/\n+/).forEach(line => { const m = line.match(/(https?:\/\/\S+|www\.\S+|youtu\.be\/\S+)/i); if (!m) return; const url = cleanUrl(m[1]); if (url && !out.some(l => l.url === url)) out.push({ url, label: line.replace(m[1], "").replace(/^[\s:\-–]+|[\s:\-–]+$/g, "").slice(0, 80) }); }); return out.slice(0, 8); }
function linksHtml(e, title) { const L = linksOf(e); if (!L.length) return ""; return '<div class="links">' + (title ? "<h3>" + esc(title) + "</h3>" : "") + L.map(l => '<a class="lk" href="' + esc(l.url) + '" target="_blank" rel="noopener noreferrer"><span class="ic">' + (isVideo(l.url) ? "▶️" : "🔗") + '</span><span class="grow"><b>' + esc(l.label || (isVideo(l.url) ? "Vídeo que a professora indicou" : "Link que a professora indicou")) + '</b><span class="u">' + esc(l.url) + "</span></span></a>" + (e.id && ytId(l.url) && sample ? (l.read ? '<p class="small" style="margin:-2px 0 8px"><span class="tag ok">vídeo já entrou no material</span></p>' : '<button class="btn block" style="margin:-2px 0 10px" data-a="video" data-id="' + e.id + '" data-u="' + esc(l.url) + '">🎬 Ler este vídeo para o quiz</button>') : "")).join("") + "</div>"; }

/* ============ estado salvo no aparelho ============ */
const KEY = "semana-de-prova:v1";
let storageOk = true;
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) { const s = JSON.parse(raw); if (s && Array.isArray(s.kids)) return s; } }
  catch (e) { storageOk = false; }
  return { v: 1, kids: [], active: null, settings: { minutes: 45, weekends: true } };
}
let S = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { storageOk = false; } }
const kid = () => S.kids.find(k => k.id === S.active) || null;
const examOf = id => kid()?.exams.find(e => e.id === id) || null;
const sessOf = id => kid()?.sessions.find(s => s.id === id) || null;

/* ============ estado da tela ============ */
const ui = { files: [], tab: "hoje", day: today(), screen: null, arg: null, busy: null, toast: null, form: {}, quiz: null, explainLive: "" };
var sample = null, limits = null, aiChecked = false, ctl = null;
const quizJobs = {};

/* ============ IA: Gemini (chave guardada só neste aparelho, fora do backup) ============ */
const GKEY = "semana-de-prova:gemini";
const GAPI = "https://generativelanguage.googleapis.com/v1beta/";
const GDEFAULT = ["gemini-3.8-flash", "gemini-3.7-flash", "gemini-flash-latest", "gemini-2.5-flash"];
let G = (() => { try { return JSON.parse(localStorage.getItem(GKEY)) || {}; } catch (e) { return {}; } })();
const saveG = () => { try { localStorage.setItem(GKEY, JSON.stringify(G)); } catch (e) {} };
const b64 = blob => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = no; r.readAsDataURL(blob); });
function rankModels(list) {
  const ok = (list || []).filter(m => (m.supportedGenerationMethods || []).includes("generateContent")).map(m => String(m.name).replace(/^models\//, ""))
    .map(n => ({ n, m: /^gemini-(\d+(?:\.\d+)?)-flash(-lite)?$/.exec(n) })).filter(x => x.m);
  ok.sort((a, b) => (!!a.m[2] - !!b.m[2]) || (parseFloat(b.m[1]) - parseFloat(a.m[1])));
  return ok.map(x => x.n).slice(0, 5);
}
async function connectGemini(key) {
  let res; try { res = await fetch(GAPI + "models?pageSize=200", { headers: { "x-goog-api-key": key } }); } catch (e) { throw { code: "blocked" }; }
  let models = [];
  if (res.ok) models = rankModels((await res.json()).models);
  else if (res.status === 429) throw { code: "rate_limited" };
  else {
    // algumas chaves novas (AQ.) falham na listagem mas funcionam na geração: testa de verdade antes de recusar
    const err = await res.json().catch(() => ({})); const prev = G; G = { key, models: GDEFAULT, model: null };
    try { await gemini("Responda apenas: ok", {}, false); } catch (e) { G = prev; throw e.code === "bad_key" ? { code: "bad_key", message: "erro " + res.status + ": " + ((err.error && err.error.message) || "sem detalhe").slice(0, 140) } : e; }
    models = GDEFAULT;
  }
  G = { key, models: models.length ? models : GDEFAULT, model: null }; saveG(); sample = makeSample();
}
function parseLoose(t) {
  t = String(t || "").trim(); try { return JSON.parse(t); } catch (e) {}
  const f = /```(?:json)?\s*([\s\S]*?)```/.exec(t); if (f) { try { return JSON.parse(f[1]); } catch (e) {} }
  const a = t.search(/[{\[]/), z = Math.max(t.lastIndexOf("}"), t.lastIndexOf("]")); if (a >= 0 && z > a) { try { return JSON.parse(t.slice(a, z + 1)); } catch (e) {} }
  throw { code: "invalid_json", text: t };
}
async function geminiRaw(prompt, o, wantJson) {
  const parts = []; if (o.video) parts.push({ file_data: { file_uri: o.video } });
  const imgs = o.images ? (Array.isArray(o.images) ? o.images : [o.images]) : [];
  for (const im of imgs) parts.push({ inline_data: { mime_type: im.type || "image/jpeg", data: await b64(im) } });
  parts.push({ text: prompt });
  const gcfg = m => {
    const g = wantJson ? { responseMimeType: "application/json", maxOutputTokens: 8192 } : { maxOutputTokens: 4096 };
    if (/^gemini-3/.test(m)) g.thinkingConfig = { thinkingLevel: "minimal" };
    else if (/^gemini-2\.5/.test(m)) g.thinkingConfig = { thinkingBudget: 0 };
    return g;
  };
  const cands = [...new Set([G.model].concat(G.models || [], GDEFAULT).filter(Boolean))].slice(0, 4); let last = { code: "upstream_error" }, throttled = false;
  for (const m of cands) {
    const body = JSON.stringify({ contents: [{ role: "user", parts }], generationConfig: gcfg(m) });
    let res; try { res = await fetch(GAPI + "models/" + m + ":generateContent", { method: "POST", headers: { "Content-Type": "application/json", "x-goog-api-key": G.key }, body, signal: o.signal }); }
    catch (e) { throw { code: e && e.name === "AbortError" ? "cancelled" : "offline" }; }
    if (res.ok) {
      const d = await res.json(); const c = d.candidates && d.candidates[0];
      const text = ((c && c.content && c.content.parts) || []).filter(p => !p.thought).map(p => p.text || "").join("").trim();
      const fin = (c && c.finishReason) || "";
      if (!text || fin === "MAX_TOKENS") {
        if (fin === "MAX_TOKENS") throw { code: "truncated" };
        throw { code: (d.promptFeedback && d.promptFeedback.blockReason) || /SAFETY|PROHIBITED|BLOCK/.test(fin) ? "refused" : "empty_completion" };
      }
      if (G.model !== m && !throttled) { G.model = m; saveG(); }
      return text;
    }
    const err = await res.json().catch(() => ({})); const msg = (err.error && err.error.message) || "";
    if (res.status === 401 || res.status === 403 || /api key/i.test(msg)) throw { code: "bad_key", message: "erro " + res.status + ": " + msg.slice(0, 140) };
    if (res.status === 429) { last = { code: "rate_limited" }; throttled = true; continue; }
    if (res.status === 404 || res.status >= 500 || /model|not supported|not found/i.test(msg)) { last = { code: "upstream_error" }; continue; }
    throw { code: o.video ? "video_failed" : "upstream_error", message: msg };
  }
  throw last;
}
/* ============ diario tecnico: registra cada chamada de IA, para poder auditar ============ */
const LKEY = "semana-de-prova:log";
let LOG = (() => { try { return JSON.parse(localStorage.getItem(LKEY)) || []; } catch (e) { return []; } })();
const saveLog = () => { try { LOG = LOG.slice(0, 40); localStorage.setItem(LKEY, JSON.stringify(LOG)); } catch (e) {} };
function taskOf(p) {
  p = String(p || "");
  if (/comunicado de provas/.test(p)) return "comunicado";
  if (/IDENTIFIQUE O MATERIAL|transcri\u00e7\u00e3o condensada/.test(p)) return "p\u00e1ginas";
  if (/RESUMO DE ESTUDO/.test(p)) return "v\u00eddeo";
  if (/Monte um roteiro/.test(p)) return "roteiro";
  if (/m\u00faltipla escolha/.test(p)) return "quiz";
  if (/Explique para uma crian\u00e7a/.test(p)) return "explica\u00e7\u00e3o";
  return "outro";
}
const hhmm = () => { const d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
function logAI(e) { LOG.unshift(Object.assign({ hora: hhmm() }, e)); saveLog(); }
async function logged(ia, modelo, prompt, o, run) {
  const t0 = Date.now(), tarefa = taskOf(prompt), fotos = (o && o.images ? (Array.isArray(o.images) ? o.images.length : 1) : 0) + (o && o.video ? 1 : 0);
  const base = { ia, tarefa, entrada: prompt.length, fotos };
  try { const r = await run(); logAI(Object.assign({ ok: true, modelo: modelo(), seg: ((Date.now() - t0) / 1000).toFixed(1), saida: String(r).length }, base)); return r; }
  catch (e) { logAI(Object.assign({ ok: false, modelo: modelo(), seg: ((Date.now() - t0) / 1000).toFixed(1), erro: (e && e.code) || "?", detalhe: String((e && e.message) || "").slice(0, 180) }, base)); throw e; }

/* ============ 3. roteiro ============ */
function chooseBox(msg, opts) { ui.confirm = { msg, opts }; }
/* ============ ritmo de estudo (por crianca) ============ */
/* Teto diario = quanto tempo a crianca tem por dia, somando as materias.
   Ritmo = quanto conteudo cabe DENTRO de uma sessao. Sao coisas diferentes. */
const PACE = {
  calmo:  { label: "Calmo",  min: 15, max: 20, pags: 4,  dica: "Para quem precisa de mais tempo: peda\u00e7os pequenos e mais repeti\u00e7\u00e3o." },
  normal: { label: "Normal", min: 20, max: 30, pags: 8,  dica: "O padr\u00e3o: sess\u00f5es de 20 a 30 minutos." },
  puxado: { label: "Puxado", min: 25, max: 40, pags: 14, dica: "Para quem absorve r\u00e1pido: blocos maiores por sess\u00e3o." },
};
const PACEK = ["calmo", "normal", "puxado"];
function paceOf(k) { k = k || kid(); const p = k && k.pace; return PACE[p] ? p : "normal"; }
function paceRules(p) {
  const P = PACE[p];
  if (p === "calmo") return "RITMO CALMO: esta crian\u00e7a precisa de mais tempo para absorver. Sess\u00f5es de " + P.min + " a " + P.max + " minutos. Divida o conte\u00fado em MUITAS partes pequenas: cada sess\u00e3o cobre um peda\u00e7o curto, por volta de " + P.pags + " p\u00e1ginas ou um assunto s\u00f3. Prefira mais sess\u00f5es curtas a menos sess\u00f5es longas. De 3 a 4 passos por sess\u00e3o, e um deles sempre de repetir ou explicar em voz alta o que entendeu.";
  if (p === "puxado") return "RITMO PUXADO: esta crian\u00e7a absorve r\u00e1pido. Sess\u00f5es de " + P.min + " a " + P.max + " minutos, cobrindo blocos maiores, por volta de " + P.pags + " p\u00e1ginas por sess\u00e3o. De 2 a 3 passos por sess\u00e3o, diretos.";
  return "RITMO NORMAL: sess\u00f5es de " + P.min + " a " + P.max + " minutos, cobrindo por volta de " + P.pags + " p\u00e1ginas cada. De 2 a 4 passos por sess\u00e3o.";
}
/* conta paginas a partir do que a professora escreveu: "120 a 153", "40-52", "12, 15 e 18" */
function pageCount(pages) {
  const s = String(pages || ""); let n = 0;
  s.replace(/(\d{1,4})\s*(?:a|\u00e0|at\u00e9|-|\u2013|\u2014)\s*(\d{1,4})/gi, (m, a, b) => { const x = +a, y = +b; if (y >= x && y - x < 400) n += y - x + 1; return m; });
  if (n) return n;
  const nums = s.match(/\d{1,4}/g); return nums ? nums.length : 0;
}
/* estimativa grosseira de quanto cabe ate a prova, no ritmo escolhido */
function fitCheck(ex, t, p) {
  const days = studyDays(t, addDays(ex.date, -1)).length, pg = pageCount(ex.pages);
  if (!days || !pg) return null;
  const P = PACE[p], porDia = Math.max(1, Math.floor(S.settings.minutes / P.min));
  const cabe = days * porDia * P.pags;
  if (pg <= cabe * 1.2) return null;
  return { subject: ex.subject, pg, days, cabe, msg: ex.subject + ": s\u00e3o cerca de " + pg + " p\u00e1ginas e " + (days === 1 ? "sobra 1 dia" : "sobram " + days + " dias") + " at\u00e9 a prova. No ritmo " + P.label.toLowerCase() + " cabem por volta de " + cabe + ". O que voc\u00ea prefere?" };
}
function startPlan(onlyId) {
  const k = kid(), t = today(); onlyId = typeof onlyId === "string" ? onlyId : null;
  const exams = k.exams.filter(e => validD(e.date) && e.date > t && (!onlyId || e.id === onlyId));
  if (!exams.length) return makePlan(onlyId);
  const p = paceOf();
  const apertado = exams.map(e => fitCheck(e, t, p)).filter(Boolean);
  if (apertado.length) {
    const msg = apertado.length === 1 ? apertado[0].msg : apertado.length + " provas t\u00eam mais conte\u00fado do que cabe no ritmo " + PACE[p].label.toLowerCase() + " at\u00e9 a data delas. O que voc\u00ea prefere?";
    return chooseBox(msg, [
      { label: "Priorizar o mais importante", pri: true, fn: () => makePlan(onlyId, { priorizar: true }) },
      { label: "Acelerar o ritmo s\u00f3 aqui", fn: () => makePlan(onlyId, { pace: "puxado" }) },
      { label: "Montar assim mesmo", fn: () => makePlan(onlyId, {}) },
    ]);
  }
  const faltando = exams.filter(e => !e.nPages).length;
  if (faltando && sample) return confirmBox(faltando + " prova(s) ainda sem p\u00e1ginas enviadas. Montar o roteiro mesmo assim?", () => makePlan(onlyId), "Montar");
  return makePlan(onlyId);
}
function studyDays(fromS, toS) { const out = []; for (let d = fromS; d <= toS; d = addDays(d, 1)) { const w = parseD(d).getDay(); if (S.settings.weekends || (w !== 0 && w !== 6)) out.push(d); } return out; }
function mkSession(ex, date, type, title, minutes, steps, ord) {
  return { id: uid(), examId: ex.id, date: date || null, ord: ord || 0, type, title: String(title).slice(0, 90), minutes: Math.max(10, Math.min(60, Number(minutes) || 25)), steps: steps.slice(0, 6).map(t => ({ t: String(t).slice(0, 220), done: false })), done: false, explain: "", score: null };
}
/* quanto do material pedido no comunicado realmente entrou no app */
function coverage(ex) {
  const want = pageCount(ex.pages); if (!want) return null;
  seedBlocks(ex); const got = new Set();
  ex.blocks.forEach(b => { const n = parseInt(b.pagina, 10); if (n) got.add(n); });
  if (!got.size) return null;
  return { want, got: got.size, falta: Math.max(0, want - got.size) };
}
function basicSessions(ex, pace) {
  const P = PACE[pace] || PACE.normal, pg = pageCount(ex.pages);
  const partes = Math.max(1, Math.min(6, pg ? Math.ceil(pg / P.pags) : (ex.content.length > 6000 ? 3 : 2)));
  const where = ex.pages ? " (" + ex.pages + ")" : "";
  const lk = linksOf(ex).length ? [(hasVideo(ex) ? "Assista ao v\u00eddeo" : "Acesse o link") + " que a professora indicou (bot\u00e3o no alto da tela)."] : [];
  const out = [];
  for (let i = 0; i < partes; i++) out.push(mkSession(ex, null, "estudo", ex.subject + ": parte " + (i + 1) + " de " + partes, P.min, (i === 0 ? lk : []).concat(["Leia com calma o material" + where + ".", "Escreva no caderno 3 coisas importantes que voc\u00ea leu.", "Explique em voz alta para algu\u00e9m o que entendeu."]), i + 1));
  out.push(mkSession(ex, addDays(ex.date, -1), "revisao", ex.subject + ": revis\u00e3o para a prova", P.min, ["Releia suas anota\u00e7\u00f5es e os t\u00edtulos do material" + where + ".", "Refa\u00e7a um exerc\u00edcio que voc\u00ea achou dif\u00edcil.", "Fa\u00e7a o quiz de revis\u00e3o."], partes + 1));
  return out;
}
function planPrompt(exams, t, pace, opts) {
  return "Monte um roteiro de estudos para uma crian\u00e7a do " + kid().grade + " (Brasil) em semana de provas. Hoje \u00e9 " + nice(t) + " (" + t + ").\n" +
    "Divida o estudo de cada prova em PARTES numeradas, em ordem de estudo. N\u00c3O distribua as partes por dia e N\u00c3O cite datas: a crian\u00e7a escolhe quando fazer cada parte.\n" +
    paceRules(pace) + "\n" +
    (opts && opts.priorizar ? "ATEN\u00c7\u00c3O: h\u00e1 mais conte\u00fado do que tempo at\u00e9 a prova. Ordene come\u00e7ando pelo que tem mais chance de cair, e escreva \"(extra)\" no fim do t\u00edtulo das partes menos essenciais.\n" : "") + "\nPROVAS:\n" +
    exams.map(e => "- id " + e.id + " | " + e.subject + " | prova em " + e.date + " | cai: " + (e.topics || "n\u00e3o informado") + " | material indicado: " + (e.pages || "n\u00e3o informado") + (linksOf(e).length ? " | a professora indicou " + linksOf(e).length + " link(s): " + linksOf(e).map(l => (isVideo(l.url) ? "v\u00eddeo" : "site") + (l.label ? " (" + l.label + ")" : "")).join(", ") : "") + (e.content ? " | trecho do material guardado: " + e.content.slice(0, 1100).replace(/\s+/g, " ") : " | ATEN\u00c7\u00c3O: o material ainda n\u00e3o foi enviado")).join("\n") +
    "\n\nREGRAS:\n" +
    "1. Cada prova vira de 2 a 8 partes, cobrindo TODO o material guardado, sem deixar assunto de fora e sem repetir conte\u00fado entre partes.\n" +
    "2. A \u00daLTIMA parte de cada prova \u00e9 do tipo \"revisao\" e revisa a mat\u00e9ria inteira. Todas as outras s\u00e3o do tipo \"estudo\".\n" +
    "3. Numere em \"ordem\" come\u00e7ando em 1, do mais b\u00e1sico ao mais avan\u00e7ado.\n" +
    "4. Cada parte tem um foco diferente e cita as p\u00e1ginas e os assuntos reais daquela parte.\n" +
    "5. Passos concretos come\u00e7ando com verbo, em linguagem simples para a idade. N\u00e3o inclua \"fazer o quiz\" como passo (o aplicativo j\u00e1 oferece).\n" +
    "6. Se a prova tem link indicado pela professora, a PRIMEIRA parte precisa ter um passo para assistir ou acessar, dizendo que o bot\u00e3o do link est\u00e1 no alto da tela (n\u00e3o escreva o endere\u00e7o).\n" +
    "7. O t\u00edtulo diz a mat\u00e9ria e o foco, por exemplo \"Ci\u00eancias: cadeia alimentar\".\n\n" +
    "Responda SOMENTE com JSON: {\"sessoes\":[{\"prova_id\":\"\",\"ordem\":1,\"tipo\":\"estudo\",\"titulo\":\"\",\"minutos\":20,\"passos\":[\"\",\"\"]}]}";
}
async function makePlan(onlyId, opts) {
  const k = kid(), t = today(); onlyId = typeof onlyId === "string" ? onlyId : null; opts = opts || {};
  const exams = k.exams.filter(e => validD(e.date) && e.date > t && (!onlyId || e.id === onlyId));
  if (!exams.length) return toast(onlyId ? "Essa prova precisa de uma data a partir de amanh\u00e3 para entrar no roteiro." : k.exams.length ? "Nenhuma prova com data a partir de amanh\u00e3. Confira as datas." : "Adicione as provas primeiro.");
  const kept = k.sessions.filter(s => s.done || (onlyId && s.examId !== onlyId));
  const pace = PACE[opts.pace] ? opts.pace : paceOf();
  let sessions = [], usedAI = false;
  if (sample) {
    busy(onlyId ? "Montando o roteiro de " + exams[0].subject + "\u2026" : "Montando o roteiro\u2026", "Isso leva at\u00e9 um minuto.");
    try {
      const r = await askJSON(planPrompt(exams, t, pace, opts), { cache: false });
      const por = {};
      for (const s of (r && r.sessoes) || []) {
        const ex = exams.find(e => e.id === s.prova_id); if (!ex) continue;
        const steps = (Array.isArray(s.passos) ? s.passos : []).filter(x => typeof x === "string" && x.trim());
        if (!steps.length) continue;
        (por[ex.id] = por[ex.id] || []).push({ ex, tipo: s.tipo === "revisao" ? "revisao" : "estudo", titulo: s.titulo || ex.subject, minutos: s.minutos, steps, ordem: Number(s.ordem) || 99 });
      }
      for (const id of Object.keys(por)) {
        const lista = por[id].sort((a, b) => a.ordem - b.ordem);
        lista.forEach((x, i) => sessions.push(mkSession(x.ex, x.tipo === "revisao" ? addDays(x.ex.date, -1) : null, x.tipo, x.titulo, x.minutos, x.steps, i + 1)));
      }
      usedAI = sessions.length > 0;
    } catch (e) { if (e.code === "cancelled") return idle(); toast(errMsg(e) + " Montei um roteiro simples no lugar."); }
  }
  for (const ex of exams) if (!sessions.some(s => s.examId === ex.id)) sessions.push(...basicSessions(ex, pace));
  k.sessions = kept.concat(sessions).sort((a, b) => {
    const da = (k.exams.find(e => e.id === a.examId) || {}).date || "9", db = (k.exams.find(e => e.id === b.examId) || {}).date || "9";
    return da.localeCompare(db) || (a.ord || 0) - (b.ord || 0);
  });
  k.planAt = t; save(); ui.tab = "hoje"; ui.screen = null; idle();
  if (usedAI || !sample) toast(onlyId ? "Roteiro de " + exams[0].subject + " pronto!" : "Roteiro pronto!");
}

async function explain(sid) {
  const s = sessOf(sid), ex = s && examOf(s.examId); if (!s || !ex) return;
  if (!sample) return toast("Para explicar, ligue a IA na aba Pais.");

      { signal: ctl.signal, onText: ({ text }) => { ui.explainLive = text; const el = $("#explain"); if (el) el.textContent = text; } });

function quizPrompt(s, ex) {

  const misses = ex.misses.slice(-8).map(m => m.topic).filter(Boolean);
  return "Crie " + n + " perguntas de múltipla escolha para uma criança treinar depois de estudar.\n" + sessionContext(s, ex) +

    'Responda SOMENTE com JSON: {"perguntas":[{"pergunta":"","opcoes":["","","",""],"correta":0,"explicacao":"","assunto":"tema em poucas palavras"}]}';

function fetchQuiz(sid, fresh) {
  if (!fresh && quizJobs[sid]) return quizJobs[sid];
  const s = sessOf(sid), ex = s && examOf(s.examId);
  const job = (async () => {
    const r = await sample.json(quizPrompt(s, ex), { cache: false });
    const qs = [];
    for (const q of (r && r.perguntas) || []) {
      if (!q || !q.pergunta || !Array.isArray(q.opcoes) || q.opcoes.length < 2) continue;
      const ci = Number(q.correta); if (!(ci >= 0 && ci < q.opcoes.length)) continue;
      const opts = shuffle(q.opcoes.map((t, i) => ({ t: String(t), ok: i === ci })));
      qs.push({ q: String(q.pergunta), opts, why: String(q.explicacao || ""), topic: String(q.assunto || "") });
    }
    if (!qs.length) throw { code: "invalid_json" };
    return qs;
  })();
  job.catch(() => { if (quizJobs[sid] === job) delete quizJobs[sid]; });
  quizJobs[sid] = job; return job;
}
async function startQuiz(sid) {
  if (!sample) return toast("Para o quiz, ligue a IA na aba Pais.");

  try { const qs = await fetchQuiz(sid); delete quizJobs[sid]; ui.quiz = { sid, qs, i: 0, picked: null, right: 0, wrong: [] }; ui.screen = "quiz"; idle(); }
  catch (e) { delete quizJobs[sid]; idle(); toast(errMsg(e)); }
}
function finishQuiz() {
  const z = ui.quiz, s = sessOf(z.sid), ex = s && examOf(s.examId);
  if (s && ex) {
    s.score = { right: z.right, total: z.qs.length, at: today() }; s.done = true; s.steps.forEach(x => x.done = true);
    ex.asked = ex.asked.concat(z.qs.map(q => q.q.slice(0, 90))).slice(-40);
    ex.misses = ex.misses.concat(z.wrong).slice(-20); save();
  }
  ui.screen = "result"; render();
}

    (ui.form.io ? '<textarea id="io" style="margin-top:10px;font-size:.78rem" ' + (ui.form.io === "export" ? "readonly>" + esc(JSON.stringify(S)) : 'placeholder="Cole o código aqui">') + "</textarea>" + (ui.form.io === "import" ? '<div class="btns"><button class="btn pri" data-a="doimport">Restaurar</button></div>' : "") : "") + "</div>";
  h += '<p class="small muted">As explicações e perguntas são feitas por IA a partir do material enviado e podem conter erros. Na dúvida, vale o que está no livro e o que a professora ensinou.</p>';
  return h;
}
function vDiag() {
  const e = examOf(ui.arg), k = kid(); if (!e) { ui.screen = null; return vProvas(); }
  seedBlocks(e);
  const ss = k.sessions.filter(x => x.examId === e.id);
  let h = '<button class="link" data-a="back">\u2039 Voltar</button><h1>O que a IA entendeu</h1><p class="muted">Prova de ' + esc(e.subject) + ". Confira aqui de onde veio cada coisa.</p>";
  h += '<div class="card"><h2>1. Do comunicado</h2><p class="small"><b>Data:</b> ' + (validD(e.date) ? esc(nice(e.date)) : "sem data") + '</p><p class="small"><b>O que cai:</b> ' + (esc(e.topics) || '<span class="muted">nada anotado</span>') + '</p><p class="small"><b>P\u00e1ginas indicadas:</b> ' + (e.pages ? '<b class="mk">' + esc(e.pages) + "</b>" : '<span class="muted">nada anotado</span>') + '</p><p class="small muted">Se as p\u00e1ginas acima estiverem erradas, a IA leu o comunicado errado. Corrija em Editar e monte o roteiro de novo.</p><div class="btns"><button class="btn ghost" data-a="editexam" data-id="' + e.id + '">Editar a prova</button></div></div>';
  h += '<div class="card"><h2>2. Material lido</h2>' + (matLabel(e) ? '<p class="small"><b>Identificado como:</b> ' + esc(matLabel(e)) + "</p>" : '<p class="small muted">Material n\u00e3o identificado.</p>') +
    '<p class="small"><b>' + e.blocks.length + " bloco(s)</b> \u00b7 " + (e.content || "").length + " caracteres guardados" + ((e.content || "").length >= MAX_CONTENT ? ' \u00b7 <span class="tag bad">no limite</span>' : "") + "</p>" +
    (e.blocks.length ? '<div style="max-height:300px;overflow:auto">' + e.blocks.map((b, i) => '<div style="padding:6px 0;border-bottom:1.5px dashed var(--line)"><div class="row between"><span class="grow small"><b>' + (esc(b.assunto) || "(sem assunto)") + "</b>" + (b.pagina ? ' <span class="tag">p. ' + esc(b.pagina) + "</span>" : "") + "</span><span class=\"small muted\">" + b.texto.length + " car.</span></div>" + (b.conceitos && b.conceitos.length ? '<p class="small muted" style="margin:2px 0">' + esc(b.conceitos.join(", ")) + "</p>" : "") + '<button class="link small" data-a="blocktxt" data-i="' + i + '">' + (ui.openBlock === i ? "esconder o texto" : "ver o texto") + "</button>" + (ui.openBlock === i ? '<div class="explain small">' + esc(b.texto) + "</div>" : "") + "</div>").join("") + "</div>" : '<p class="small muted">Nenhuma p\u00e1gina lida ainda.</p>') + "</div>";
  h += '<div class="card"><h2>3. Roteiro montado</h2>' + (ss.length ? ss.map(x => '<div style="padding:8px 0;border-bottom:1.5px dashed var(--line)"><div class="row between"><span class="grow small"><b>' + esc(x.title) + "</b></span><span class=\"small muted\">" + esc(nice(x.date)) + " \u00b7 " + x.minutes + " min</span></div><ul class=\"plain small\">" + x.steps.map(y => "<li>" + esc(y.t) + "</li>").join("") + "</ul></div>").join("") : '<p class="small muted">Roteiro ainda n\u00e3o montado.</p>') +
    '<p class="small muted">Os passos s\u00e3o escritos pela IA a partir das p\u00e1ginas indicadas acima. Se ela citou um intervalo menor que o do comunicado, foi ela que dividiu o conte\u00fado \u2014 confira se todas as p\u00e1ginas aparecem somando as sess\u00f5es.</p>' +
    (ss.length ? '<div class="btns"><button class="btn" data-a="planone" data-id="' + e.id + '">Refazer o roteiro desta prova</button></div>' : "") + "</div>";
  return h;
}
function vPages() {
  const e = examOf(ui.arg); if (!e) { ui.screen = null; return vProvas(); }
  return '<button class="link" data-a="back">\u2039 Voltar</button><h1>P\u00e1ginas de ' + esc(e.subject) + '</h1><p class="muted">Tire uma foto por p\u00e1gina, na ordem. Elas se juntam aqui e s\u00e3o lidas todas de uma vez.</p>' +
    '<div class="card">' + (ui.files.length ? "<h3>" + ui.files.length + ' p\u00e1gina(s) na fila</h3><div style="max-height:260px;overflow:auto">' + ui.files.map((f, i) => '<div class="row between" style="padding:6px 0;border-bottom:1.5px dashed var(--line)"><span class="grow small" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + (i + 1) + ". " + (isPdf(f) ? "\ud83d\udcd5 " : isDocx(f) ? "\ud83d\udcd8 " : "\ud83d\uddbc\ufe0f ") + esc(f.name || "foto") + '</span><button class="link" data-a="rmfile" data-i="' + i + '">tirar</button></div>').join("") + "</div>" : '<p class="muted small">Nenhuma p\u00e1gina na fila ainda.</p>') +
    '<div class="btns"><button class="btn pri block" data-a="pagecam">\ud83d\udcf7 Tirar foto da p\u00e1gina</button><button class="btn block" data-a="pagefile">\ud83d\uddbc\ufe0f Escolher do aparelho</button></div>' +
    (ui.files.length ? '<div class="btns"><button class="btn pri block" data-a="pagesgo">Ler as ' + ui.files.length + ' p\u00e1gina(s)</button></div>' : "") + "</div>" +
    '<p class="small muted">As fotos s\u00e3o lidas pelo Gemini e n\u00e3o ficam guardadas: o app salva s\u00f3 o texto, neste aparelho. Se puder, corte da foto o nome completo da crian\u00e7a.</p>';
}
function render() {
  const k = kid(); let h;
  if (!k || ui.screen === "welcome") h = vWelcome();
  else if (ui.screen === "notice") h = vNotice();
  else if (ui.screen === "exam") h = vExamForm();
  else if (ui.screen === "paste") h = vPaste();
  else if (ui.screen === "pages") h = vPages();
  else if (ui.screen === "diag") h = vDiag();
  else if (ui.screen === "session") h = vSession();
  else if (ui.screen === "quiz") h = vQuiz();
  else if (ui.screen === "result") h = vResult();
  else h = ui.tab === "provas" ? vProvas() : ui.tab === "pais" ? vPais() : vHoje();
  if (k && !ui.screen) h += '<nav class="nav" aria-label="Seções">' + [["hoje", "📅", "Hoje"], ["provas", "📝", "Provas"], ["pais", "👀", "Pais"]].map(([t, ic, l]) => '<button data-a="tab" data-t="' + t + '"' + (ui.tab === t ? ' aria-current="page"' : "") + '><span class="ic">' + ic + "</span>" + l + "</button>").join("") + "</nav>";
  if (ui.busy) h += '<div class="veil" role="alertdialog" aria-label="Aguarde"><div class="card"><div class="pencil">✏️</div><h2>' + esc(ui.busy.msg) + '</h2><p class="muted small">' + esc(ui.busy.sub) + '</p><div class="btns" style="justify-content:center"><button class="btn ghost" data-a="stop">Parar</button></div></div></div>';
  if (ui.confirm) h += '<div class="veil" role="alertdialog" aria-label="Confirmar"><div class="card"><h2>' + esc(ui.confirm.msg) + '</h2><div class="btns" style="justify-content:center;flex-direction:column">' + (ui.confirm.opts ? ui.confirm.opts.map((o, i) => '<button class="btn ' + (o.pri ? "pri" : "") + ' block" data-a="copt" data-i="' + i + '">' + esc(o.label) + "</button>").join("") + '<button class="btn ghost block" data-a="cno">Cancelar</button>' : '<button class="btn ghost" data-a="cno">Cancelar</button><button class="btn pri" data-a="cyes">' + esc(ui.confirm.label || "Sim") + "</button>") + "</div></div></div>";
  $("#app").innerHTML = h;
}
function keepForm() { document.querySelectorAll("#app input[id],#app textarea[id],#app select[id]").forEach(el => { const m = { kname: "name", kgrade: "grade", kpace: "pace", ntext: "ntext", esub: "subject", edate: "date", etop: "topics", epag: "pages", elinks: "links", ptext: "ptext", msis: "msis", mvol: "mvol", medi: "medi" }[el.id]; if (m) ui.form[m] = el.value; }); }

/* ============ ações ============ */
const A = {
  tab(d) { ui.tab = d.t; ui.screen = null; ui.form = {}; },
  kid(d) { S.active = d.id; save(); ui.screen = null; },
  newkid() { ui.form = {}; ui.screen = "welcome"; },
  back() { ui.screen = null; ui.form = {}; if (ctl) ctl.abort(); ui.explainLive = ""; },
  savekid() { const name = (ui.form.name || "").trim(); if (!name) return toast("Escreva o nome ou apelido."); const k = { id: uid(), name: name.slice(0, 20), grade: ui.form.grade || "5º ano", pace: PACE[ui.form.pace] ? ui.form.pace : "normal", exams: [], sessions: [], planAt: null }; S.kids.push(k); S.active = k.id; save(); ui.screen = null; ui.form = {}; ui.tab = "provas"; },
  delkid(d) { const x = S.kids.find(k => k.id === d.id); if (!x) return; confirmBox("Remover " + x.name + " e tudo o que foi salvo?", () => { S.kids = S.kids.filter(k => k.id !== d.id); if (S.active === d.id) S.active = S.kids[0]?.id || null; save(); }, "Remover"); },
  newweek() { const k = kid(); confirmBox("Apagar as provas e o roteiro de " + k.name + " para começar uma nova semana?", () => { k.exams = []; k.sessions = []; k.planAt = null; save(); ui.tab = "provas"; }, "Apagar"); },
  notice() { ui.form = {}; ui.files = []; ui.screen = "notice"; },
  async noticefile() { const files = await pickFiles(); keepForm(); for (const f of files) if (ui.files.length < 12) ui.files.push(f); render(); },
  rmfile(d) { ui.files.splice(+d.i, 1); },
  noticego() { const t = (ui.form.ntext || "").trim(); if (!ui.files.length && t.length < 10) return toast("Escolha os arquivos ou cole o texto do aviso."); readNotice(ui.files.slice(), t); },
  addexam() { ui.form = {}; ui.screen = "exam"; },
  editexam(d) { const e = examOf(d.id); if (!e) return; ui.form = { id: e.id, subject: e.subject, date: e.date, topics: e.topics, pages: e.pages, nPages: e.nPages, links: linksOf(e).map(l => l.url + (l.label ? " " + l.label : "")).join("\n"), msis: (e.material || {}).sistema || "", mvol: (e.material || {}).volume || "", medi: (e.material || {}).edicao || "" }; ui.screen = "exam"; },
  saveexam() { const f = ui.form, k = kid(); if (!(f.subject || "").trim()) return toast("Escreva a matéria."); if (!validD(f.date)) return toast("Escolha o dia da prova."); let e = f.id && examOf(f.id); if (!e) { e = { id: uid(), content: "", blocks: [], material: null, nPages: 0, misses: [], asked: [] }; k.exams.push(e); } const moved = e.date && e.date !== f.date; Object.assign(e, { subject: f.subject.trim().slice(0, 60), date: f.date, topics: (f.topics || "").trim(), pages: (f.pages || "").trim(), links: parseLinks(f.links) }); const ms = (f.msis || "").trim(), mv = (f.mvol || "").trim(), me = (f.medi || "").trim(); e.material = (ms || mv || me) ? { sistema: ms.slice(0, 60), volume: mv.slice(0, 60), edicao: me.slice(0, 60), serie: (e.material && e.material.serie) || kid().grade } : null; k.exams.sort((a, b) => (a.date || "9").localeCompare(b.date || "9")); save(); ui.screen = null; ui.form = {}; if (moved && k.sessions.length) toast("Data mudou: monte o roteiro de novo."); },
  delexam() { const k = kid(), id = ui.form.id; confirmBox("Apagar esta prova e as sessões dela?", () => { k.exams = k.exams.filter(e => e.id !== id); k.sessions = k.sessions.filter(s => s.examId !== id); save(); ui.screen = null; ui.form = {}; }, "Apagar"); },
  clearpages() { const e = examOf(ui.form.id); if (!e) return; confirmBox("Apagar o conte\u00fado lido das p\u00e1ginas desta prova?", () => { e.content = ""; e.blocks = []; e.material = null; e.nPages = 0; ui.form.nPages = 0; save(); }, "Apagar"); },
  pages(d) { ui.form = {}; ui.files = []; ui.arg = d.id; ui.screen = "pages"; window.scrollTo(0, 0); },
  async pagecam() { const files = await pickFiles(true); for (const f of files) if (ui.files.length < 24) ui.files.push(f); render(); },
  async pagefile() { const files = await pickFiles(false); for (const f of files) if (ui.files.length < 24) ui.files.push(f); render(); },
  pagesgo() { if (!ui.files.length) return toast("Tire ou escolha ao menos uma p\u00e1gina."); readPages(ui.arg, ui.files.slice()); },
  diag(d) { ui.arg = d.id; ui.openBlock = null; ui.screen = "diag"; window.scrollTo(0, 0); },
  blocktxt(d) { ui.openBlock = ui.openBlock === +d.i ? null : +d.i; },
  video(d) { readVideo(d.id, d.u); },
  async gsave() { const key = ($("#gkey") ? $("#gkey").value : "").trim(); if (key.length < 20) return toast("Cole a chave inteira do Gemini."); busy("Testando a chave…"); try { await connectGemini(key); idle(); toast("IA ligada! Modelo: " + (G.models[0] || "Gemini")); } catch (e) { idle(); toast(errMsg(e)); } },
  async rsave() { const key = ($("#rkey") ? $("#rkey").value : "").trim(); if (key.length < 20) return toast("Cole a chave inteira do Groq."); busy("Testando a chave\u2026"); try { await connectGroq(key); idle(); toast("Segunda IA ligada! Modelo: " + (R.models[0] || "Groq")); } catch (e) { idle(); toast(errMsg(e)); } },
  roff() { confirmBox("Desligar a segunda IA e apagar a chave deste aparelho?", () => { R = {}; saveR(); }, "Desligar"); },
  goff() { confirmBox("Desligar a IA e apagar a chave deste aparelho?", () => { G = {}; saveG(); sample = null; }, "Desligar"); },
  planone(d) { const e = examOf(d.id); if (!e) return; return startPlan(e.id); },
  paste(d) { ui.form = {}; ui.arg = d.id; ui.screen = "paste"; window.scrollTo(0, 0); },
  savepaste() { const e = examOf(ui.arg), t = (ui.form.ptext || "").trim(); if (!e) return; if (t.length < 20) return toast("Cole o texto do material primeiro."); const a = addText(e, "Material colado", t); e.nPages = (e.nPages || 0) + 1; save(); ui.screen = null; ui.form = {}; toast(a.added ? "Material guardado! J\u00e1 vale para as explica\u00e7\u00f5es e os quizzes." : "Esse texto j\u00e1 estava guardado."); },
  plan() { return startPlan(null); },
  open(d) { ui.screen = "session"; ui.arg = d.id; ui.explainLive = ""; window.scrollTo(0, 0); },
  step(d) { const s = sessOf(ui.arg); if (!s) return; const x = s.steps[+d.i]; x.done = !x.done; save(); if (sample && s.steps.every(y => y.done) && !s.score) fetchQuiz(s.id).catch(() => {}); },
  toggledone() { const s = sessOf(ui.arg); s.done = !s.done; save(); if (s.done) { ui.screen = null; } },
  explain() { explain(ui.arg); },
  quiz() { startQuiz(ui.arg); },
  pick(d) { const z = ui.quiz; if (z.picked !== null) return; z.picked = +d.i; const q = z.qs[z.i]; if (q.opts[z.picked].ok) z.right++; else z.wrong.push({ q: q.q.slice(0, 90), topic: q.topic }); },
  nextq() { const z = ui.quiz; if (z.i + 1 < z.qs.length) { z.i++; z.picked = null; window.scrollTo(0, 0); } else return finishQuiz(); },
  quitquiz() { confirmBox("Sair do quiz? As respostas não ficam salvas.", () => { ui.screen = "session"; ui.quiz = null; }, "Sair"); },
  endquiz() { ui.screen = null; ui.quiz = null; ui.tab = "hoje"; },
  retryquiz() { const sid = ui.quiz.sid; ui.arg = sid; ui.screen = "session"; ui.quiz = null; startQuiz(sid); },
  stop() { if (ctl) ctl.abort(); idle(); },
  copt(d) { const o = ui.confirm && ui.confirm.opts && ui.confirm.opts[+d.i]; ui.confirm = null; if (o && o.fn) return o.fn(); },
  cno() { ui.confirm = null; },
  cyes() { const f = ui.confirm && ui.confirm.yes; ui.confirm = null; if (f) return f(); },
  clearlog() { LOG = []; saveLog(); },
  export() { ui.form.io = ui.form.io === "export" ? null : "export"; },
  import() { ui.form.io = ui.form.io === "import" ? null : "import"; },
  doimport() { try { const s = JSON.parse($("#io").value); if (!s || !Array.isArray(s.kids)) throw 0; confirmBox("Substituir os dados deste aparelho pelos do código?", () => { S = s; S.settings = S.settings || { minutes: 45, weekends: true }; save(); ui.form = {}; toast("Dados restaurados."); }, "Substituir"); } catch (e) { toast("Esse código não é válido."); } },
};
document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-a]"); if (!b || b.disabled) return;
  keepForm(); const fn = A[b.dataset.a]; if (!fn) return;
  fn(b.dataset); render();
});
document.addEventListener("change", ev => {
  const c = ev.target.dataset && ev.target.dataset.c; if (!c) return;
  if (c === "minutes") S.settings.minutes = +ev.target.value;
  if (c === "weekends") S.settings.weekends = ev.target.checked;
  if (c === "pace") { const kk = S.kids.find(x => x.id === ev.target.dataset.id); if (kk) kk.pace = PACE[ev.target.value] ? ev.target.value : "normal"; }
  save(); if (c === "pace") render();
});
document.addEventListener("focusin", ev => { if (ev.target.id === "io" && ev.target.readOnly) ev.target.select(); });
render();
</script>
</body>
</html>
