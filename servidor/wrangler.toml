name = "semana-de-prova"
main = "src/worker.js"
compatibility_date = "2026-09-20"

# Endereços que podem chamar este Worker. Vazio = não barra ninguém.
# Acrescente o domínio próprio aqui quando comprar.
[vars]
ORIGENS = "https://sivicentes.github.io"
TETO_DIA = "120"

# Contador do teto diário, criado com `npm run servidor:kv`.
# Este id não é segredo: ele só funciona para quem está logado na conta.
# Para recriar em outra conta: rode o comando de novo e troque o id aqui.
[[kv_namespaces]]
binding = "KV"
id = "4bd6ba6bc78f42cdad16633a141c96be"

# Segredos NÃO ficam aqui. São enviados pela linha de comando:
#   npm run servidor:chave     (GEMINI_KEY)
#   npm run servidor:groq      (GROQ_KEY)
#   npm run servidor:codigos   (CODIGOS)
# Para conferir quais existem, sem ver os valores:
#   npx wrangler secret list --config servidor/wrangler.toml
